id: M1-batch18-oci-queue-regression
title: Unblock the batch 17D live via-queue regression that was waiting on OCI SSH
owner: qa-infra
priority: high
complexity: small
status: verified_live
inputs:
  - server/cmd/headless-bot (via-queue mode, merged in 5892f41 by session A)
  - the live systemd deployment on 127.0.0.1:18080
dependencies:
  - M1-batch17-unity-matchmaking-queue
outputs:
  - live via-queue exit-gate evidence against the deployed build
acceptance:
  - headless-bot -via-queue forms every match through POST /v1/queue
  - all matches report terminal_snapshots_equal and client_streams_equal
  - direct mode on fixed seeds reproduces the recorded baseline scores
  - telemetry counters show no dropped events and no export errors
validation:
  - WORDARENA_ADDR=http://127.0.0.1:18080 headless-bot -via-queue -rounds 2 -seeds 1,2,3
  - WORDARENA_ADDR=http://127.0.0.1:18080 headless-bot -rounds 2 -seeds 1512,1513,1517
file_ownership:
  - agent/tasks/M1-batch18-oci-queue-regression.yml
risk: low
escalation: none
local_validation:
  - OCI SSH recovered at ~10:17 UTC after the 08:20Z degradation window; the
    systemd service had stayed active throughout, so this was an access
    problem and never a service regression
  - via-queue: 6/6 matches EXIT-GATE PASS, all terminal snapshots and client
    streams equal, 12 intents per match
  - direct control: 6/6 EXIT-GATE PASS with scores identical to the
    2026-09-09 baseline (43:45 / 37:60 / 44:40 across seeds 1512/1513/1517)
  - /metrics after the run: 180 intents received, 180 words accepted,
    0 rejected, 242 telemetry events written, 0 dropped, 0 export errors
notes:
  - This executes session A's batch 17D task; the headless-bot source and the
    OCI ops lane remain session A's. Session C only ran the validation and
    recorded the evidence.
