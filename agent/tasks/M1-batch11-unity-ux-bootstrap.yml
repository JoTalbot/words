owner: unity-client
priority: normal
complexity: medium
inputs:
  - docs/ROADMAP.md
  - docs/unity-server-architecture.md
  - client/unity/Assets/Scenes/Main.unity
  - client/unity/Assets/Editor/BuildCommand.cs
