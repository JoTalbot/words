id: M1-batch27b-endpoint-persistence
title: Persist the Unity server endpoint and allow non-UI override for automated device runs
owner: unity-client
priority: high
complexity: small
status: validated_static_pending_ci_unity6_compile_fix
risk: low
escalation: none

inputs:
  - agent/state/current.yml resume_from priority 2 (endpoint field has no persistence and no non-UI override)
  - client/unity/Assets/Scripts/WordArenaBootstrap.cs (serverUrl field, DrawConnectionPanel, Awake)

dependencies:
  - M1-batch17-unity-matchmaking-queue

outputs:
  - client/unity/Assets/Scripts/WordArenaBootstrap.cs (ResolveServerUrl, PlayerPrefs persistence, [WORDS_SERVER] marker)
  - agent/tasks/M1-batch27b-endpoint-persistence.yml

acceptance:
  - >-
    Endpoint resolution runs at startup with the documented precedence:
    WORDARENA_SERVER_URL environment, <persistentDataPath>/server_url.txt
    file, PlayerPrefs words.server_url, then the loopback default. (The
    -wordsServerUrl argument channel from the original design was removed in
    the Unity 6 compile fix: Unity's netstandard shim has no
    Application.arguments property.)
  - "A value typed into the Server field is persisted to PlayerPrefs and restored on the next launch."
  - "Startup logs [WORDS_SERVER] url=... source=... so a device smoke can verify which channel won without reading preferences."
  - "A broken/missing file channel degrades to the next candidate instead of preventing startup."

validation:
  - "python static sanity: braces balanced, markers present, no forbidden UnityEngine.UI/EventSystems deps"
  - "Pending: Unity Android workflow green on the merged commit"

file_ownership:
  - client/unity/Assets/Scripts/WordArenaBootstrap.cs
  - agent/tasks/M1-batch27b-endpoint-persistence.yml

notes: >-
  This unblocks real-device play tests against the live OCI service the moment
  the Q8 edge/TLS decision lands: a smoke script can push server_url.txt
  (debug build: adb push + run-as on scoped-storage APIs) or pass
  -wordsServerUrl, and the client points at the right server without typing on
  a screen. The UI field remains the manual channel and now persists.
