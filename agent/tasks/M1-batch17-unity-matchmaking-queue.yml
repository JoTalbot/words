id: M1-batch17-unity-matchmaking-queue
title: Unity matchmaking queue flow (enqueue, poll, connect with issued seat token)
owner: unity-client
priority: high
complexity: medium
status: validating_local_green_ci_pending
inputs:
  - server/cmd/game/matchmaking.go (queueEntry contract)
  - docs/WIRE-PROTOCOL.md
  - client/unity/Assets/Scripts/WordArenaNetworkClient.cs
  - client/unity/Assets/Scripts/WordArenaBootstrap.cs
dependencies:
  - M1-batch16-unity-gestures-result-ux
outputs:
  - EnqueueQueue/PollQueue coroutines + QueueEntryResult/QueueEntryResponseJson
  - Find match (queue) / Stop searching controls with queue status line
  - 1.5 s poll loop with retry on transient errors, HTTP 410 expiry handling
  - lazy seat binding from the authoritative snapshot via SeatForUser(user_id)
  - queue-token reconnect fallback in ReconnectActiveSeat
acceptance:
  - Enqueue returns queue_id and transitions waiting -> matched (verified live on OCI with two anonymous players)
  - On match, client connects with the server-issued seat token only (no peer token knowledge)
  - Seat index is derived from the snapshot user ids, never assumed client-side
  - Expired entries (410) stop polling with user guidance; transient poll failures retry
  - Local demo mode and Create server match flow unchanged
  - No uGUI/EventSystem dependency introduced
validation:
  - "python static Unity script sanity: braces, Batch 17A markers, no forbidden deps"
  - cd server && go vet ./...
  - cd server && go test ./cmd/game -run 'TestMatchmaker|TestQueue' -count=1
  - "live OCI queue contract check: two enqueues -> both matched, distinct seat tokens"
  - GitHub CI push run after integration
  - GitHub Unity Android workflow_dispatch build_type=debug run_smoke_tests=true
file_ownership:
  - client/unity/Assets/Scripts/WordArenaNetworkClient.cs
  - client/unity/Assets/Scripts/WordArenaBootstrap.cs
  - agent/tasks/M1-batch17-unity-matchmaking-queue.yml
risk: medium
escalation: strong-model
local_validation:
  - "python static sanity: passed (braces balanced, markers present, forbidden deps absent)"
  - "go vet ./...: passed"
  - "go test -run 'TestMatchmaker|TestQueue': passed"
  - "live OCI queue contract: enqueue A waiting -> enqueue B matched immediately -> poll A matched, match_id/tokens/user_ids per seat"
notes:
  - >-
    Pairing, seat tokens and match creation remain fully server-side; the client only transports
    the issued credentials, keeping matchmaking authoritative and replayable
    (docs/ARCHITECTURE.md).
