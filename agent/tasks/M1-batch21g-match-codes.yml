id: M1-batch21g-match-codes
title: Unguessable match codes and a per-match read capability for result/replay
owner: backend-security
priority: high
complexity: medium
status: queued
dependencies:
  - M1-batch21a-security-hardening
  - M1-batch19-schema-migrations
inputs:
  - server/cmd/game/api.go (handleResult/handleReplay, createRoom)
  - server/cmd/game/store_pg.go (match_results schema)
  - infra/migrations (must gain a paired 002_*.sql)
outputs:
  - match id stays internal; clients receive a 128-bit match code that maps to it
  - >-
    a read capability stored with the result so finished matches survive restart without a
    credential-free read
  - migration 002 + pgSchema update (the drift test enforces the pair)
acceptance:
  - >-
    GET result/replay by raw sequential id is not possible on a hardened deployment
    (WORDARENA_REQUIRE_READ_CAPABILITY=true, default true once the Unity/web-m0/headless-bot
    clients all send the capability)
  - a durable read after service restart still succeeds (batch 8 criterion kept)
  - the schema drift test passes with both sides updated
  - docs/WIRE-PROTOCOL.md documents the transition window for the old form
validation:
  - cd server && go vet ./... && go test -count=1 ./...
  - cd server && go test ./cmd/migrate -count=1 -v
  - infra/smoke.sh against a fresh instance
  - live headless-bot exit gate on the OCI deployment
risk: medium
escalation: strong-model
notes:
  - >-
    Filed 2026-09-10 from docs/SECURITY-REVIEW-M1.md finding S-2: the live-board leak is closed
    (S-1), the finished-match enumeration stays accepted for the loopback deployment until this
    lands.
