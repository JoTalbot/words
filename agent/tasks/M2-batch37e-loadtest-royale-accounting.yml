id: M2-batch37e-loadtest-royale-accounting
title: "Loadtest harness: mark post-over server closes as graceful; revisit royale word-search geometry"
status: merged_green
priority: low
complexity: small
inputs:
  - server/cmd/loadtest/main.go read loop (seats_dropped counts any server-side close mid-run)
  - server/cmd/game/api.go runRoomTicker (closes the room at over+3s by design)
  - batch 37B soak findings (royale legs: dropped == seats, accepted-plateau at wave boundary, ~95 percent blocked rejects)
outputs:
  - harness distinguishes expected post-over closes from unexpected mid-match kills (e.g. via observed terminal frame or close status)
  - note on royale-mode intent outcomes (cull spectators + scaled-board geometry) so future royale load legs read correctly
acceptance:
  - a royale leg no longer reports seats_dropped for closes that follow the terminal snapshot
  - existing per-seat-limiter drop accounting (35C) remains intact (its stage contract is unchanged)
validation:
  - go test ./cmd/loadtest/
  - one manual royale leg showing dropped==0 after the terminal frame
risk: low
file_ownership:
  - server/cmd/loadtest/
  - docs/M2-LOAD-TESTING.md (verdict text only)
escalation: none
evidence:
  - "PR #63 (merged 835a101). The task's premise was incomplete: the harness did not merely mis-count post-over closes - it read no deltas at all, so in delta mode it flew the board it received at dial time and never saw the terminal frame. That single defect produced BOTH 37B royale-leg readings (seats_dropped == seats and the accepted plateau)."
  - "Fix: protocol.ApplyDelta under the base_version rule (a delta the seat cannot apply is dropped and counted as deltas_stale; the next full snapshot self-heals), the terminal frame recognised from either frame kind, post-terminal closes counted in seats_closed_after_over and never folded into seats_dropped (35C limiter accounting intact), websocket close statuses reported by code."
  - "Measured on the same 4-seat 195 s leg against an isolated instance: pre-38C dropped=4 intents=368 accepted=15; classification-only dropped=4 closes 1011x4; delta-aware dropped=0 closes 1000x4 intents=48 accepted=12 deltas_stale=0. Artifacts artifacts-38c/prefix-royale.json, fixed-royale.json, fixed2-royale.json."
  - "Royale note published in docs/M2-LOAD-TESTING.md 'Batch 38C': a small-roster Royale board is cleared in ~24 s (server log lifecycle=over ticks=721), post-over intents return MATCH_NOT_ACTIVE rather than closing the socket, and what the server removes ~3 s after the terminal frame is the room, not the socket."
