id: M2-batch39c-intent-decomposition
title: "Close the 39B RTT-decomposition limitation: the harness carries the server-side intent_process summary out of GET /metrics"
status: merged_green
priority: normal
complexity: small
inputs:
  - "server/cmd/loadtest/main.go serverSnapshot (which discarded the metrics body)"
  - "the fixed-bucket server histogram wordarena_intent_process_us (batch 35C)"
outputs:
  - "intentProcessSummary {count, sum_us, mean_us, p95_us_floor} parsed from JSON /metrics and written into the report as server_intent_process_us"
  - "a summary line in the human output; 2 parser tests"
  - "docs/M2-LOAD-TESTING.md Batch 39C section with the measured decomposition from a verification leg"
acceptance:
  - "the report decomposes client RTT vs server work for any future leg without extra tooling"
  - "p95 is labelled as a bucket floor (the fixed histogram cannot do better); le_inf maps to the 10000 floor"
  - "a zero histogram stays zeroed and is omitted from the report"
validation:
  - "go test ./cmd/loadtest/"
  - "one 2x60 verification leg on the OCI host with the new harness"
risk: low
file_ownership:
  - "server/cmd/loadtest/main.go"
  - "server/cmd/loadtest/server_intent_test.go"
  - "docs/M2-LOAD-TESTING.md"
  - "agent/tasks/M2-batch39c-intent-decomposition.yml"
evidence:
  - "verification leg 2x60 (artifacts-39c/report-decomp2x60.json): 120 clients, intents 6479 sent = 6479 acked, full 180 s budget both matches, deltas_stale 0, seats_dropped 0, CPU 2.57 percent, RSS 12.6 to 35.7 MB, 424 B/s per client"
  - "decomposition: client RTT p50 12.0 ms / p95 41.9 ms vs server submit mean 571 us / p95 floor 2500 us - the server is about 5 percent of the median path (the 39B generator-side reading stands, now measured); the submit tail is roster-shaped (1v1 saw 84 percent under 50 us, a 60-seat room p95 sits at 2.5 ms) but small in absolute terms"
