id: M2-batch35a-antisnowball-calibration
title: "Anti-snowball calibration: per-match HTTP opt-in + simulation sweep (rebuild of lost batch 34B)"
status: code_complete_suite_green_sweep_running
priority: high
complexity: large
dependencies:
  - M2 batch 32C (catch-up rule, merged)
  - M2 batch 33 (protocol handshake, merged)
inputs:
  - server/internal/match/antisnowball.go (rule + CatchUpParams)
  - server/internal/pve (deterministic driver policy)
  - docs/M2-ANTI-SNOWBALL.md
  - docs/ROADMAP.md (anti-snowball row)
outputs:
