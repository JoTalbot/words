id: M1-batch28c-diagonal-swipe
title: Multi-row diagonal swipe gesture verified by the device smoke
owner: unity-client
priority: low
complexity: small
status: validated_static_pending_ci
risk: low
escalation: none

inputs:
  - client/unity/Assets/Scripts/WordArenaBootstrap.cs (ExtendDragPath eight-way adjacency + bridge rules)
  - tools/android-smoke.sh (gesture smoke, batch 27A screen coordinates)
  - docs/ROADMAP.md Claim / Lock / Cross-Steal exit criterion

dependencies:
  - M1-batch27a-device-leg-coords

outputs:
  - tools/android-smoke.sh (second scripted diagonal swipe)
  - agent/tasks/M1-batch28c-diagonal-swipe.yml

acceptance:
  - >-
    After the existing row swipe passes, the smoke performs a second scripted
    diagonal swipe from cell (0,0) to cell (2,2), and logcat shows a second
    [WORDS_SWIPE] marker with cells >= 3 and a word other than the deterministic
    row-0 word TAAN. The endpoints are two rows apart, so any such path spans
    multiple rows; cells >= 3 is the provable minimum because the bridge rule
    fills the middle cell when the pointer jumps straight from (0,0) to (2,2).
  - "The assertion proves the eight-way adjacency rule on a real device, not just in unit-reasoned code."

validation:
  - "bash -n tools/android-smoke.sh: clean"
  - "unity-android.yml parses as YAML; both upload blocks carry logcat-diagonal.txt"
  - "Pending: one green Unity Android run with both swipe markers"

file_ownership:
  - tools/android-smoke.sh
  - agent/tasks/M1-batch28c-diagonal-swipe.yml

notes: >-
  The gesture code already implements eight-way adjacency and single-cell
  bridging (batch 17E); this task gives it device-level evidence. With the
  static demo board (T A A N / D S V T / G C O D) a diagonal from cell (0,0)
  to (1,1) to (2,2) must extend the path across rows, which a row-only swipe
  cannot do.
