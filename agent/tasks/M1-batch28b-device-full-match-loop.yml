id: M1-batch28b-device-full-match-loop
title: Unattended full-match device loop from queue to authoritative MATCH OVER
owner: qa-infra
priority: normal
complexity: medium
status: unblocked_deploy_pending_ssh_key
risk: medium
escalation: none

inputs:
  - tools/android-smoke.sh (device assertion, board rect handling from batch 27A)
  - client/unity/Assets/Scripts/WordArenaBootstrap.cs (queue flow 17A, send path, result overlay)
  - docs/ROADMAP.md shared board UX exit criterion (b)

dependencies:
  - M1-batch27a-device-leg-coords
  - M1-batch27b-endpoint-persistence

outputs:
  - tools/android-smoke.sh (full-match leg)
  - client/unity/Assets/Scripts/WordArenaBootstrap.cs (auto-send + [WORDS_MATCH_COMPLETE] marker)
  - agent/tasks/M1-batch28b-device-full-match-loop.yml

acceptance:
  - >-
    On a device with the server reachable (27B override), the smoke enqueues a
    seat, plays a scripted word on each wave, and the match reaches its
    terminal state with the authoritative MATCH OVER overlay visible.
  - "The client logs [WORDS_MATCH_COMPLETE] final=... source=result-endpoint so the leg asserts the authoritative record, not local score."
  - "The loop is bounded: a hard tick budget turns a stuck match into PRODUCT_FAIL with artifacts instead of hanging the runner."

validation:
  - "bash -n tools/android-smoke.sh: clean"
  - "python static sanity: braces balanced, marker present, no forbidden deps"
  - "Pending: one green Unity Android run with the full-match leg"

file_ownership:
  - tools/android-smoke.sh
  - client/unity/Assets/Scripts/WordArenaBootstrap.cs
  - agent/tasks/M1-batch28b-device-full-match-loop.yml

notes: >-
  Today the device smoke proves selection only (WORDS_SWIPE) and stops.
  The full loop is the exit criterion that lets the shared board UX row
  flip to [x] without leaving "production UI" as an unmeasured claim.
  Q8 DECIDED OPEN 2026-09-13 (owner): stage 1 = Cloudflare quick tunnel
  on the OCI host (infra/expose-quick.sh, systemd unit words-tunnel,
  abuse/capacity/rollback notes in docs/SECURITY-EXPOSURE.md) - the
  origin stays loopback-only, TLS at the Cloudflare edge, no public
  port. Deployment itself is pending the OCI SSH key (lost in the
  sandbox re-provision 18:24Z 2026-09-13; reissue is the top human
  item). IMPLEMENTATION DESIGN (now that a reachable server exists):
  (1) the device smoke leg pushes the public URL through the 27B file
  channel (adb push server_url.txt + run-as) so the emulator client
  points at https://<tunnel>; (2) the opponent is headless-bot in a new
  -partner mode: ONE queue enqueue, wait for the real client to pair,
  then play to terminal state with the existing exact-cover wave solver
  (reuses botClient/coverWave/solveSeed; -via-queue already proves the
  enqueue + pairing mechanics); (3) the client gets a bounded
  auto-play loop for server matches - each wave it builds candidate
  paths (rows, then eight-way neighbours), validates against the
  client dictionary, submits the first legal word, and retries another
  path on rejection - plus the [WORDS_MATCH_COMPLETE] final=...
  source=result-endpoint marker after Fetch result confirms the
  terminal snapshot; (4) the leg asserts the marker + the MATCH OVER
  overlay and turns a stuck match into PRODUCT_FAIL via a hard tick
  budget instead of hanging the runner. Everything else already exists
  (queue flow, send path, overlay, endpoint channel, smoke scaffolding).
