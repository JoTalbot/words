id: M2-batch38e-socket-lifetime-after-over
title: "Decide and, if warranted, implement the socket lifetime after a match ends (room removed, connection left open)"
status: done_decision_recorded_no_code_change
priority: normal
complexity: small
inputs:
  - server/cmd/game/api.go runRoomTicker (removes the room ~3 s after the terminal frame, closes subscriber channels, returns)
  - server/cmd/game/api.go handleWS (reader stays blocked in conn.Read until the client acts)
  - docs/WIRE-PROTOCOL.md line ~271 (documents that the room is removed; says nothing about closing the socket)
  - batch 38C measurement (artifacts-38c/fixed2-royale.json): a 195 s leg whose match ended at 24 s logged GET /v1/match/ws dur=3m15s - the client, not the server, ended every connection
outputs:
  - a written decision: either the socket is closed by the server after the room is removed (normal closure 1000/1001), or the current behaviour is pinned as intended in WIRE-PROTOCOL.md
  - if a close is added - a client-contract note, a regression test, and a device/CI confirmation that the Unity client still fetches its result via the result endpoint after the close
acceptance:
  - the documented contract and the implementation agree, whichever way the decision goes
  - no behaviour changes without the contract sentence and the test that pin it
validation:
  - go test ./cmd/game/
  - one 4-seat leg showing the close origin (server vs client) in the close status histogram
risk: medium
file_ownership:
  - server/cmd/game/
  - docs/WIRE-PROTOCOL.md
  - docs/M2-LOAD-TESTING.md (evidence text only)
escalation: review
decision: >
  Keep the current behaviour and pin it in the contract. The server removes the
  room ~3 s after the terminal frame and does NOT close the socket; the client
  closes when it is done. A server-initiated close (1000/1001) was evaluated and
  declined for M2: it changes client-visible behaviour for no correctness gain, a
  client already learns the outcome from the terminal frame plus the durable
  result endpoint, and the behaviour now has a measured basis (batch 38C leg:
  a 195 s run whose match ended at 24 s ended only when the client closed).
  Recorded in docs/WIRE-PROTOCOL.md section 9 and section 3.1 - if a future
  session wants the close, it must start from that text rather than from scratch.
evidence:
  - "docs/WIRE-PROTOCOL.md section 9: explicit socket-lifetime paragraph; section 3.1 cross-references it."
  - "No code change, therefore no behaviour change: no regression risk for the Unity client's result fetch."
  - "Reopening requires a product/owner input only if the socket count at scale becomes a measured problem - the 37B soak showed the goroutine side of this path is stable (v3 drains to baseline)."
