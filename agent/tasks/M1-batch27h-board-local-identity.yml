file_ownership:
  - client/unity/Assets/Scripts/WordArenaBootstrap.cs
  - agent/tasks/M1-batch27h-board-local-identity.yml

notes: >-
  The 27G probe closed the eight-run mystery: input delivery was healthy the
  whole time (taps and swipes reached Unity with a constant (40,40) offset
  that is the BeginArea origin, not an emulator bug), the board rects were
  right, the focus gates were right - the hit test itself double-converted
  the event. BoardLocalPoint was written against the assumption that
  Event.current.mousePosition is in raw screen pixels; IMGUI converts it
  into the current GUI space while the matrix + area are active, which is
  why the 26D-era green (fallback x=100 with fat margins) worked and every
  measured-coordinate run since 27A died at local x=-28. The fix is the
  identity transform; the screen-space math the device smoke relies on is
  untouched and remains measured from the client.
