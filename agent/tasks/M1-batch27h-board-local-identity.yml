id: M1-batch27h-board-local-identity
title: Stop double-subtracting the 40 px area inset in the board hit test (BoardLocalPoint)
owner: unity-client
priority: critical
complexity: small
status: validated_local_pending_unity_build
risk: low
escalation: none

inputs:
  - "Run 34770332786 (27G probe, head 918948a) leg 35: [WORDS_INPUT] down gui=120,703 test=80,663 hit=0 for an adb tap at screen (160,743) - the event arrives already area-local, exactly the (40,40) BeginArea origin subtracted"
  - "Same run: [WORDS_INPUT] down gui=12,703 test=-28,663 hit=none for the swipe start at screen x=52 - the double-subtracted local x=-28 missed every cell, the drag never armed, no WORDS_SWIPE; identical on the full-restart retry and on both emulator legs"
  - "History explained by the same defect: the green run 34683472147 (fallback x=100..950 y=880) survived the double subtraction by margin (100->60->20 >= 0), the 27A coordinate fix moved the swipe to the board's real left edge (x=52) where the double-subtracted coordinate goes negative, and the 26D-era scheduled failures (swipe from x=12) missed for the same class of reason"
  - client/unity/Assets/Scripts/WordArenaBootstrap.cs (BoardLocalPoint, HandleBoardGesture, OnGUI GUI.matrix + BeginArea)

dependencies:
