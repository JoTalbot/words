outputs:
  - client/unity/Assets/Scripts/WordArenaBootstrap.cs (BoardLocalPoint is now the identity transform with the measured evidence in the comment; [WORDS_INPUT] labels gui=/test=)
  - agent/tasks/M1-batch27h-board-local-identity.yml

acceptance:
  - "BoardLocalPoint returns its input unchanged: under the active GUI.matrix + BeginArea, IMGUI delivers Event.current.mousePosition already in the area-local space shared by the GetLastRect cell captures, so no inset subtraction and no scale division may be applied again."
  - "The device-side screen<->local math is unchanged and stays in LogBoardRectOnce (sx*/sy*: screen = (local + 40) * scale) - the smoke keeps swiping at measured screen coordinates."
  - "A Unity Android run on the merged commit passes both legs: row swipe [WORDS_SWIPE] cells=4 word=TAAN, diagonal cells>=3 word != TAAN."

validation:
  - "python static sanity: C# braces balanced, task graph clean"
