risk: >
  Low. Device smoke script and workflow docs only - no product code. Worst
  case is another INFRA_FAIL classification on the device leg, which cannot
  affect server/client behaviour. The runner-local server binds only
  127.0.0.1 on an ephemeral GitHub runner and is killed on script exit
  (trap EXIT); the emulator reaches it through the standard AOSP 10.0.2.2
  host alias.
notes: >
  The version-matched local server is strictly better evidence for THIS
  smoke (client protocol compatibility) than a tunnel that may lag main; the
  tunnel remains first choice because it also exercises the live deployment
  and its public edge. The GitHub variables API is permanently unusable with
  the current PAT (404 on repo variables and orgs endpoints), which is why
  the fix is self-containment rather than updating WORDS_SERVER_URL.
