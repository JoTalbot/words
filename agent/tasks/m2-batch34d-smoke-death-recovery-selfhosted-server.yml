goal: >
  Fix the two device-smoke failure modes measured on scheduled run 34889290062
  (2026-09-14 19:50 UTC, API 35 leg, INFRA_FAIL):
  (1) INSTALL/LAUNCH RACE. `adb install` printed Success while PackageManager
  post-processing was still running; the app launched, reached
  "isLoading: false" and "Fully drawn +4s529ms", then the finalization landed
  ("ApplicationInfo updating for com.jotalbot.words" at +5 s) and the SYSTEM
  KILLED the live process (onPause -> onDestroy -> Quitting process ->
  "Process ... has died: fg TOP"); the launcher took the foreground. The
  pre-swipe focus gate misdiagnosed the corpse as a first-run sheet: 3 rounds
  of sheet taps + a SystemUI force-stop, all no-ops, INFRA_FAIL.
  (2) STALE SERVER URL. The full-match leg depends on the Q8 tunnel URL
  (repo variable WORDS_SERVER_URL); the recorded URL
  (ireland-placement-dot-inner) is dead, and the GitHub variables API is
  unreachable with the current PAT (repo + orgs endpoints 404), so the leg
  would INFRA_FAIL on /healthz even after fixing (1).
evidence: |-
  1. Run 34889290062 job 104129445922 log - install 19:57:04.8 Success;
     launch 19:57:05; focus held 19:57:06.6; fully drawn 19:57:09.2;
     "ApplicationInfo updating" 19:57:09.729; process died 19:57:10.463;
     focus lost 19:57:29; sheet taps 19:57:29-41; SystemUI kill;
     INFRA_FAIL 19:57:46.
  2. Artifact android-smoke-diagnostics logcat-full.txt - single install;
     PromiseIcon removal 19:57:07.2 and packageinstaller activity until
     19:57:09.7 prove finalization was still in flight after launch.
  3. External check - ireland-placement-dot-inner.trycloudflare.com does not
     resolve; hour-define-resistant-loan.trycloudflare.com is the live
     tunnel (readyz postgres ok).
  4. Verification run 34906844282 on this branch (2c20758) - settle + gates
     held: gesture legs fully green (WORDS_SWIPE cells=4 TAAN, diagonal
     cells=3 TSO, WORDS_SWIPE_SMOKE_OK), sheet dismissed round 1, resolver
     detected the stale configured URL and started the runner-local server
     (healthy in 30 s, source=runner-local), partner enqueued on 127.0.0.1.
     NEW third failure mode measured: the client read the endpoint file
     ([WORDS_SERVER] url=http://10.0.2.2:18080 source=file:...) and the
     enqueue threw "InvalidOperationException: Insecure connection not
     allowed" - Android 9+ cleartext block (targetSdk 35, no manifest
     exception); partner's queue entry expired (HTTP 410), PARTNER-GATE
