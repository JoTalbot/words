changes: |-
  tools/android-smoke.sh:
  a) Post-install settle (sleep 5, bounded, comment cites run 34889290062)
     so PackageManager finalization lands before the first launch.
  b) pre_swipe_focus_gate: liveness check first - if `adb shell pidof $PKG`
     is empty the app is DEAD, not covered: force-stop, logcat -c, cold
     `am start -W`, bounded focus wait (60 s), then wait for the NEW
     session's "isLoading: false" before returning; sheet taps only for a
     live-but-covered app; distinct INFRA_FAIL text for the dead path.
  c) Full-match leg self-contained server resolution: configured
     WORDS_SERVER_URL used when /healthz passes (source=configured);
     otherwise build+run the SAME-COMMIT server on the runner
     (WORDARENA_ADDR=127.0.0.1:18080, WORDARENA_ALLOW_BOT_SEATS=true,
     in-memory storage; go run from server/) and split the URLs - client
     gets http://10.0.2.2:18080 (AOSP host alias), partner bot gets
     http://127.0.0.1:18080 (source=runner-local); skip only when neither
     a reachable server nor a Go toolchain exists; trap-EXIT cleanup kills
     the `go run` child then parent (order verified locally, port freed).
  d) Partner bot -addr and the client server_url file now use PARTNER_ADDR
     / CLIENT_URL respectively.
  .github/workflows/unity-android.yml: server_url input description and the
  setup echo updated to the 34D fallback semantics (no behaviour change in
  the workflow itself; it keeps passing WORDS_SERVER_URL through).
  client/unity/Assets/Plugins/WordArenaNetSec.androidlib (+ folder meta,
  PluginImporter Android-enabled): an Android LIBRARY plug-in whose only job
  is to merge android:networkSecurityConfig into the final app manifest.
  Its AndroidManifest.xml (package com.jotalbot.words.netsec, required by
  Unity for .androidlib) carries the attribute; its
  res/xml/network_security_config.xml keeps cleartext DENIED globally
  (identical to the API 28+ platform default) and permits it ONLY for
  10.0.2.2, localhost and 127.0.0.1 - loopback-like automation hosts that
  are not routable on real devices, so the shipped-build posture is
  unchanged. NOTE: the first attempt (custom main manifest +
  Assets/Plugins/Android/res) was REJECTED by Unity 6 in run 34910227019:
  "OBSOLETE - Providing Android resources in Assets/Plugins/Android/res was
  removed, move your resources to an AAR or an Android Library". The custom
  main manifest was dropped entirely - it would have overridden the
  unityLibrary manifest for no additional benefit.
  SECOND MEASURED FACT (run 34912557224 on c0e4d40): the .androidlib merge
  worked perfectly - the APK contains res/xml/network_security_config.xml
  verbatim (10.0.2.2/localhost/127.0.0.1 entries extracted from the packaged
  binary XML) and the merged manifest carries android:networkSecurityConfig -
  yet UnityWebRequest STILL threw "Insecure connection not allowed". Unity's
  Android pre-check consults only the GLOBAL policy
  (NetworkSecurityPolicy.isCleartextTrafficPermitted() without hostname), so
  domain-scoped exceptions can never pass it.
  client/unity/Assets/Editor/BuildCommand.cs therefore rewrites the config at
  build time (ApplyNetworkSecurityConfig): debug builds get base-config
  cleartextTrafficPermitted=true (development images only - that is what CI
  device automation installs), release builds get the strict committed
  variant (cleartext denied for every origin, identical to the platform
  default). The committed file is the strict release variant.
