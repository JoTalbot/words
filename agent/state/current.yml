  - >-
    Batch 17D (server QA): two-queue-client live match on OCI (enqueue both seats, play a
    headless-driven match through queued tokens) as an end-to-end matchmaking regression
  - >-
    M1 client follow-up: live-device/server configuration (runtime server endpoint field) once the
    Q8 edge-exposure decision is made; loopback-only until then
