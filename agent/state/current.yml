  - B3 Unity Editor unavailable on Linux/ARM64 OCI host; mitigated by GitHub-hosted x86_64 Unity CI, so no local Unity work is possible.
  - >-
    Q8 edge/TLS exposure decision (docs/PRODUCT-DECISIONS.md) still open, and it now has a second
    reason: with the service loopback-only, SSH is the ONLY observation channel, so a saturated
    host makes the deployment temporarily unobservable. Batch 21A closed the sharpest abuse hole
    (anonymous live-board read), so a future exposure starts from a better place.
  - >-
    Android local emulator on the OCI host is IMPOSSIBLE, measured 2026-09-10: /dev/kvm absent, 0
    vmx/svm CPU flags (Ampere A1 has no nested virtualization) and no Android SDK (~/Android/Sdk
    missing). The fallback chain in docs/AUTONOMOUS-DEVELOPMENT-MASTER.md section 9 therefore
    lands on a hosted emulator with a real automation API, which is what CI already uses
    (reactivecircus runner). Interactive online emulators (myandroid.org and similar) expose no
    authorized automation, so they are not used and their limits are respected.
  - >-
    B3: Unity Editor unavailable on Linux/ARM64 OCI host; Unity/Android client development must use
    GitHub-hosted x86_64 Unity/Android CI or another authorized remote build/device backend
failed_tasks:
  - >-
    Unity Android runs 34455925881 / 34457772896 / 34459251481 and 34492844342 (both legs) failed
    on hosted-emulator instability. Root cause finally identified from the screenshot artifact
    rather than the logs: "System UI isn't responding" owns the foreground, so `adb shell input
    swipe` is delivered to the system dialog and the WORDS_SWIPE marker never appears. Repaired in
    21B (ANR dialog suppression, focus gate, failure classes) instead of weakening the assertion.
  - >-
    Local-LLM worker qwen2.5:7b (batch 21C drafting task) TIMED OUT at 420s with "nothing
    written"; an earlier attempt failed inside the harness (bash expanded $p before jq saw it, so
    Ollama answered "missing request body"). Verdict: 7b codegen is not viable on this host; the
    artifact was written by the orchestrator and the tooling now guards capacity.
  - agent/state/current.yml itself was not parseable YAML for the whole history of the file (verified on the pre-edit commit), which defeats its purpose as a machine-readable resume state. Fixed in this batch by folding every multi-line list item into a block scalar with no content change.
  - >-
    Unity Android latest-main run 34437012338 failed in hosted emulator unlock before APK install
    (`adb shell input keyevent 82` Broken pipe/exit 224); same head retried as run 34437841806 and
    completed success, so treat 34437012338 as runner/emulator flake unless it recurs
