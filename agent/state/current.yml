android_backend: >-
  ANDROID_BACKEND=github-hosted-emulator (reactivecircus android-emulator-runner,
  API 35 x86_64, pixel_2, first leg only - the API 33 retry leg is now skipped
  when the first passes). GREEN as of run 34683472147 on main 1798b93. The
  decisive change is hardware acceleration: the workflow opens /dev/kvm before
  the emulator starts, so the guest boots in 31645 ms instead of 368727-587748 ms
  and com.android.systemui no longer ANRs. Verified end to end on the device:
  focus held by com.jotalbot.words, SetGameState isLoading=false, a real
  adb input swipe resolved to "[WORDS_SWIPE] cells=4 word=DSVT", logcat and
  screenshot artifacts captured. No local emulator is possible on OCI (no
  /dev/kvm, no nested virt, no SDK) and no third-party online emulator is used,
  because none offers authorized automation here.

