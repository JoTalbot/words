  - >-
    Batch 27F (Unity input-gate focus cycle, PR #26 merged into ac650b0):
    run 07aa6e6 (27E fix) finally ran a HEALTHY client - board rect
    published 1.6 s after ready with correct screen coordinates, swipe
    planned at x=52..992 y=743 inside row 0 - yet the swipe produced no
    WORDS_SWIPE and the post-swipe screenshot showed the full UI rendered
    with NO sheet in front. The run's logcat-full.txt is decisive: Unity
    logged windowFocusChanged 'true' at launch (16:13:06.003) and 'false'
    0.5 s later (16:13:06.537, a first-boot focus flap), then never
    'true' again; dumpsys reported our window focused from 16:13:16.2
    onward while the app rendered normally. Verdict: Unity's own input
    gate (its windowFocusChanged flag) stays stuck at 'unfocused' after
    the flap and silently drops every synthetic gesture, independent of
    the ImmersiveModeConfirmation sheet (a secondary obstacle the 27D
    pre-swipe gate already handles). Fix: the client logs [WORDS_FOCUS]
    gained/lost on Application.focusChanged so the smoke asserts on
    Unity's own gate; the smoke forces one HOME -> relaunch focus cycle
    right before the swipe and requires a [WORDS_FOCUS] gained line in
    logcat before any input (INFRA_FAIL 8 + evidence otherwise); the
    board rect is re-derived if the relaunch re-publishes it; and if the
    first swipe still yields no WORDS_SWIPE, the script retries once
    from a full cold restart (the exact sequence of the green run
    34683472147). Also fixed a duplicated nested board-rect poll loop
    left by 27D.
  - >-
    Batch 27E (AWAKE NRE ROOT CAUSE + fix, PR #25 merged into 07aa6e6):
    the 27D [WORDS_DIAG] instrumentation paid off on the first run -
    34766120301's logcat-full.txt carried the stack:
    "NullReferenceException ... Words.Client.WordArenaBootstrap.ResolveServerUrl
    (WordArenaBootstrap.cs:188)". Line 188 is the 27B env read:
    Environment.GetEnvironmentVariable("WORDARENA_SERVER_URL").ToString().
    Unity's reference assembly declares the span return (which is exactly
    why the .ToString() form compiled after the CS0029 in run
    34763722090), but the ANDROID RUNTIME method returns null for a
    missing variable, so the Awake-time call NRE'd, the OnGUI loop died,
    and the app went silent: no WORDS_BOARD_RECT (the healthy 08:15Z run
    logged it within 0.14 s of ready; the broken builds took 122-143 s of
    polling and found nothing), no WORDS_SWIPE even from the fallback row
    y=880 that produced the green run 34683472147, and the leg 35
    screenshot showed the development console exception over a black app
    area. Static audit of the c72ce73..c2add29 diff could not see it
    because the reference-assembly type said "struct, cannot be null" -
    the compile-time and runtime worlds disagree, which is why the
    discipline is measured stacks, not read-the-code guesses. Fix: the
    env channel is meaningless in the Android player (app processes do
    not inherit custom variables from am start), so it is compiled out
    with #if !UNITY_ANDROID (kept null-safe on the desktop path).
    Precedence is now file > PlayerPrefs > loopback default on Android.
