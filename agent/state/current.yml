    contract was not machine-readable for most of the graph. Added
    tools/check-task-yaml.py (required keys, id matching the file name,
    snake_case status, string-list acceptance/validation), tools/normalize-task-yaml.py
    as the idempotent repair tool (deliberately not run by CI), wired the check
    into Container-smoke, and documented the form in docs/TASK-PROTOCOL.md.
    Verified: the checker reports "28 files, 0 problems", a second normalize run
    is a no-op, and main CI #123 plus Container smoke #18 are green with the new
    step executing it.
  - >-
    Device-smoke status after the fix, from the run logs rather than inference:
    on API 35 the emulator now fails earlier than before - sys.boot_completed
    never reached 1 within the 135 s budget (previously it booted and the app was
    SIGKILLed with "System UI isn't responding" on screen) - so the leg is
    classified INFRA and the API 33 retry leg runs automatically, which is the
    behaviour 21B was built to provide. 17E therefore stays open as a device
    backend availability item, not as a product defect: the client, the build and
    the assertion are all green, and the only failure source measured today was
    the hosted emulator pool.

active_tasks:
  - >-
    Unity Android run on main 07aa6e6 (dispatched 2026-09-13 ~16:05 UTC):
    the EXPECTED GREEN run. Both device-leg root causes are now fixed:
    (1) the coordinate defect (27A - swipe started left of the board,
    40 px area inset dropped) and (2) the Awake NullReferenceException
    (27E - GetEnvironmentVariable returns null at Android runtime where
    the reference assembly declares a span; the env channel is now
    #if !UNITY_ANDROID-only, file channel is the Android automation
    path). 27D instrumentation stays in for the first runs after this.
    Expected signature: build green; device leg prints "board rect from
    the client (screen px)" within ~1 s of ready (the healthy 08:15Z run
    logged it within 0.14 s), [WORDS_SWIPE] cells=4 word=TAAN (or DSVT
    on the fallback row), a second "diagonal marker" with cells>=3 and
    word != TAAN (WORDS_DIAGONAL_SMOKE_OK), and finally
    WORDS_SWIPE_SMOKE_OK. If a leg still fails, the artifacts now carry
    logcat-full.txt (startup record) and [WORDS_DIAG] exception stacks -
    read those before touching product code. The twice-daily schedule
    (cron 17 3,15 UTC) keeps retrying independently; concurrency group
    unity-android-main cancels in-progress, so check runs by head sha.

blocked_tasks:
