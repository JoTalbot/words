completed_tasks:
  - >-
    Batch 26A (M1 security/boundary): closed the profile-id range defect. players.id is
    BIGSERIAL (signed 64-bit) while player ids arrive as JSON uint64, so an id with the top
    bit set could never exist but three handlers passed it straight to the store:
    POST /v1/matches (player_ids) and POST /v1/queue (player_id) both answered 500
    "profile store error" for a malformed request, and parseID had no overflow guard at all,
    so it silently wrapped - measured on the unguarded parser, parseID("18446744073709551621")
    returned 5 and parseID("18446744073709551617") returned 1, both with no error, meaning a
    caller could read a profile whose id it never held by sending 2^64+n. parseID now rejects
    overflow and profileIDInRange is the single place the bound is decided. Verified A/B
    against real Postgres on OCI in a throwaway database: pre-fix 500 on both POST paths,
    post-fix 400 on both. go test 12/12, -race clean, 16 subtests, failure reproduced before
    the fix (PR #12, f9d4b4a)
  - >-
    Batch 26B (hygiene/CI): gofmt is now a merge precondition. Nothing in CI checked
    formatting, so gofmt -l flagged 8 drifted files on main. git diff -w leaves only two
    hunks, both semantically identical (fp.addU64 expanded from a semicolon one-liner, a
    stray blank line dropped in an import block); fp.go is on the deterministic fingerprint
    path so it was re-validated against the golden and byte-stability tests rather than
    assumed safe. Cross-checked that gofmt 1.24.13 (what CI installs) and 1.27.1 both report
    0 files, so the gate cannot fail on a formatter version difference (PR #13, a4b0de8)
  - >-
    Batch 26C (test correctness): the smoke replay assertion was vacuous since batch 25.
    With WORDARENA_REQUIRE_READ_CAPABILITY=true - how the service is deployed - resolveMatchRef
    refuses every numeric ref outright, so "GET /v1/matches/{id}/replay is 404 while the match
    is active" passed because the id form is refused, not because the match was active; a
    regression serving a partial event log would have left it green. It now goes through the
    match code with the read capability, which is meaningful under both gate settings.
    Discrimination proved live on OCI rather than assumed: active code+cap 404, finished
    code+cap 200 through the same route shape, finished wrong-cap 401. Count-neutral at 26/0
    bare and 27/0 with SMOKE_EXPECT_STORAGE=postgres, matching the recorded batch 25 evidence
    (PR #14, bfed583)
