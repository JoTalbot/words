    Batch 26A (M1 security/boundary): closed the profile-id range defect. players.id is
    BIGSERIAL (signed 64-bit) while player ids arrive as JSON uint64, so an id with the top
    bit set could never exist but three handlers passed it straight to the store:
    POST /v1/matches (player_ids) and POST /v1/queue (player_id) both answered 500
    "profile store error" for a malformed request, and parseID had no overflow guard at all,
    so it silently wrapped - measured on the unguarded parser, parseID("18446744073709551621")
    returned 5 and parseID("18446744073709551617") returned 1, both with no error, meaning a
    caller could read a profile whose id it never held by sending 2^64+n. parseID now rejects
    overflow and profileIDInRange is the single place the bound is decided. Verified A/B
    against real Postgres on OCI in a throwaway database: pre-fix 500 on both POST paths,
    post-fix 400 on both. go test 12/12, -race clean, 16 subtests, failure reproduced before
    the fix (PR #12, f9d4b4a)
