  - Flip the remaining [~] M1 roadmap rows by stating and meeting one exit criterion each (richer rollback animation, production shared-board UX, gesture polish).
  - Re-measure docs/LOAD-BASELINE.md after 21A; the new gates are O(1) but should be measured, not asserted harmless.
  - >-
    Batch 17B (Unity): profile-aware queueing — create/bind player profile (POST /v1/players) and
