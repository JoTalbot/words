    batch_42a: "MERGED via PR #78 -> 18bcde3 (CI + Container smoke green on the merge commit). Behavioral signal, measurement only: multi_signal - a seat fires it exactly once per match when it has fired TWO OR MORE DISTINCT signal families (rejection_streak / metronomic_cadence / word_probe / flash_path) in that match. No new heuristic: the family bitmask is populated only as the individual edge-triggered signals fire; the single constant is multiSignalArity = 2; repeated families never advance the join; rate-limited closes are a transport guard and not a family; nothing consumes the signal authoritatively. This is the observable half of the enforcement boundary's 'weigh multiple signals together' rule - a policy day can only weigh signals it has observed co-occurring. Fixed-cardinality counter wordarena_behavior_multi_signal_events_total (JSON behavior_multi_signal_events) + Prometheus + panel 11 target (the drift gate required the plot and got it), behavior_signal JSONL event. 3 new deterministic tests (join at the second distinct family over all four family pairings; repeats of one family stay quiet; clear() re-separates families while the process-lifetime counter survives). The 'cell-path geometry vs dictionary structure' candidate was evaluated and declined for now: its obvious incarnation (longer-than-longest-word admits) cannot fire because there is no word below the board's ALWAYS-ADMISSIBLE size on the 12-cell 1v1 board, and the 60-cell Royale ceiling is large enough to admit even the longest pinned words - a signal that can never fire would measure nothing."
