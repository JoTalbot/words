    batch_38c: "task 37E, and it was not the accounting bug the task file assumed. The harness read ONLY full snapshots, so in delta mode (which the server switches to after the first frame) it flew the single snapshot it received at dial time: it spelled words over long-dead cells and never saw the match end, because the terminal state arrives as a MatchStateDelta whose over flag the harness ignored. That ONE defect produced BOTH 37B royale-leg findings - seats_dropped == seats (the designed end-of-room close read as a kill) and the 'accepted plateau' (its own stale board). Fix: apply deltas with protocol.ApplyDelta under the protocol's own base_version rule (drop and let the next full snapshot self-heal otherwise, counted as deltas_stale), track the terminal frame from either frame kind, and count post-terminal closes in their own field (seats_closed_after_over) rather than folding them into seats_dropped."
    batch_38d: "the parked intent-window bug (api.go:411) is real, and it was NOT only a collision: the key matchID<<1|seat aliases as soon as a roster has more than two seats (match m seat s == match m+1 seat s-2), so two unrelated matches shared one per-second budget, and clearSeatWindows could name only seats 0 and 1 - every higher seat's timestamps stayed in the map for the life of the process. Both halves are fixed by keying the window on a (match, seat) struct and clearing exactly the roster's seats; two regression tests pin it."
    next_action: "merge 38C and 38D, confirm Container smoke is green on main again, publish the corrected royale-leg reading into docs/M2-LOAD-TESTING.md, then take the single consolidated owner-question list to the gate."

