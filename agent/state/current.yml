e and a command-line/env override so automated device runs can point the client without UI interaction. Two human blockers stay open: the B2 uk dictionary licence review and the Q8 edge/TLS exposure decision. Do not redo the verified items in completed_tasks - reuse their evidence. The Arena sandbox has no docker, adb, browser or C# compiler; Go 1.27.1 and 1.24.13 are installed under /home/user/tools and the OCI host is reachable by SSH, so build/test locally, verify live over SSH, and use GitHub CI for containers and devices."
