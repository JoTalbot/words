completed_tasks:
  - >-
    Batch 33 (M2, protocol-version debt, 2026-09-14, commit 0b71946638d291ef0dcb89208fb88dd6abe885dd): PROTOCOL-VERSION HANDSHAKE on the connect path. The WebSocket upgrade now negotiates a wire protocol version and capabilities before any game traffic. A client sends ClientHello (envelope field 4) carrying its protocol_version and a supports_delta capability; the server replies with ServerHello (envelope field 5) echoing the negotiated version and the final use_delta decision. Legacy clients that send no ClientHello are served exactly as before - no ServerHello is emitted and deltas are preserved. A client that negotiates supports_delta=false is NEVER served a MatchStateDelta (the server sends only full snapshots for it), so the server no longer unilaterally decides delta eligibility. A modern client that negotiates supports_delta=true still receives reconstructable deltas. serverProtocolVersion=1, with graceful downgrade to the client's declared version. Verified: gofmt/vet clean; full server suite passes; three new tests (TestProtocolVersionDeltaOptOut/OptIn/LegacyUnaffected) plus the existing delta/transport tests updated to negotiate. The cmd/loadtest timing test is a known resource-context flake on a loaded box and is not a regression.
  - >-
    Batch 32G (M2, PR #48, merged 24b87a0): GUILD FOUNDATION - the last open M2
    row, and the design note the row demanded turned out to be about identity
    rather than about guilds. The server had two kinds of durable state: match
    results, protected by unguessable per-match capability tokens, and ANONYMOUS
    profiles, where any caller may act as any player. A roster built on a
    caller-supplied player_id would let anyone manage any guild as anyone, and
    that abuse would already be in the data by the time a permission check was
    added - so the batch ships the smallest primitive that makes the model
    enforceable and stops there. IDENTITY: POST /v1/players now returns a
    per-profile OWNER TOKEN (128 bits from crypto/rand) exactly once; only its
    SHA-256 is stored, so a database read cannot be replayed as a player; every
    guild mutation presents it as X-Player-Token; NO endpoint trusts a
    caller-supplied player id, so impersonation is impossible by construction
    rather than by a check someone could forget; profiles created before this
    batch have no token and cannot use guilds, because minting one on demand
    would be exactly the hole being closed. MODEL (migration 005, durable both
    in memory and in Postgres): one guild per player enforced by a unique index;
    names (3-24 chars) and tags (2-5) unique case-insensitively with the
    nickname character policy; exactly one owner - ownership passes to the
    earliest-joined member when the owner leaves and the guild is DISSOLVED when
    the last member leaves, so a dead guild cannot squat on a name; roster
    capped at 50 so a guild never becomes an unbounded fan-out target; rosters
    readable without a token, every mutation requires one. ENDPOINTS: POST
    /v1/guilds, GET /v1/guilds/{id}, POST /v1/guilds/{id}/members, DELETE
    /v1/guilds/{id}/members/{player_id} (leave, or owner-removes), GET
    /v1/players/{id}/guild. THE MIGRATION DRIFT GATE HAD TO GROW: it understood
    columns added by later migrations but not TABLES, so 005 would have failed
    it; it now folds in CREATE TABLE as well, with both directions pinned by
    tests so the guard cannot quietly become a test that always passes.
    DELIBERATELY OUT of the first slice, each named in docs/M2-GUILDS.md and in
    Q12 rather than silently assumed: guild chat and its moderation/retention
    obligations, invite-only join and join requests, co-owners, the cap number,
    guild-vs-guild matchmaking and rewards. Q12 records the decided rules and
    lists the open product questions rather than answering them. 9 new tests,
    mostly refusals: token required/malformed/other-player, one guild per
    player, owner handover, dissolution and name reuse, name/tag rules, roster
    cap, legacy-profile refusal, and that the owner token never appears in a
    profile response. Verified: gofmt/vet clean, go test ./... 13/13 packages,
    go test -race ./... 0 races (twice), cmd/game -count=3 clean (one transient
    FAIL was seen once in a race run started while the previous full suite was
    still winding down; it did not reproduce in any of the following runs),
    hygiene 247/0, task-yaml 62/0, CI 6/6 green on 1c59fd7 including the
    migration job that now applies 005.
  - >-
    Batch 32F (M2, PR #47, merged 4477798): INFRASTRUCTURE LOAD TESTING - the
    row is closed and the useful output is not a capacity number (that depends
    entirely on the box) but the ceilings that measurement found. Deliverables:
    server/cmd/loadtest (creates matches over the real HTTP surface, drives one
    WebSocket client per seat, submits DICTIONARY WORDS over free cells on a
    cadence, and reports create/intent latency percentiles, per-kind frame and
    byte accounting, server CPU and RSS from /proc, the intent-outcome
    histogram, and every reason the load fell short - skips, 429 throttles, dial
    errors - with run() split from flag parsing so CI can drive it);
    tools/loadtest-isolated.sh (the safe path: its own port, in-memory storage,
    drive, drain, tear down, never the live service);
    server/cmd/loadtest/loadtest_test.go (three-second CI run against a real
    server process, so the tool cannot rot); docs/M2-LOAD-TESTING.md
    (methodology, isolation rule, measurement table, what is deliberately not
    measured). MEASUREMENTS on a 4 vCPU box, 30 s stages, generator on the same
    box so latency and CPU are upper bounds: 8x2/16 clients -> create p95 15 ms,
    intent p95 3.0 ms, 163 B/s per client, 1.7 % of a core; 3x60/180 clients ->
    intent p95 56 ms, 900 B/s per client, 158 KB/s total, 4.7 % of a core;
    120x2/240 clients -> intent p95 32 ms, 10.3 % of a core, 53.3 MB RSS;
    300x2/600 clients -> intent p95 67 ms, 12.7 % of a core, 94.0 MB RSS;
    400 rooms with NO clients for 60 s -> 6.6 CPU-seconds (0.28 ms CPU per room
    per second) and 107.6 MB (about 270 KB per live room). Zero room leaks,
    dropped frames, failed creates (with the admission limit opened) or
    unhealthy states in any stage. THE 32A BUDGET IS NOW CONFIRMED FROM OUTSIDE:
    1v1 clients cost 163-178 B/s and a full-lobby client about 900 B/s, the top
    of the predicted 0.6-0.9 KB/s band. TWO CEILINGS FOUND BY MEASURING RATHER
    THAN PREDICTING: (1) the first thing anyone meets is an admission control,
    not capacity - a 400-room burst failed every create after room 121 with 429
    'too many requests from this caller', because WORDARENA_MUTATIONS_PER_MIN
    defaults to 120 per caller per minute, so a burst of N lobbies takes at
    least N/120 minutes however idle the box is; the harness now honours
    Retry-After, counts throttles in its report and can pace with -create-rate,
    and the capacity stages above were run with that limit raised on the
    isolated instance ON PURPOSE (recorded, not hidden). (2) Rooms OUTLIVE their
    clients by design: measured drain after every client left was 180.2 s, the
    full match length, so capacity is a product (creations/s x 180 s) and the
    state to plan for is a box full of abandoned rooms - which is why the
    no-client stage exists and why MEMORY (about 270 KB per room), not CPU, is
    the first resource to watch. FINDING THAT MATTERS MOST FOR M3: a full
    lobby's cost is FRAMES, not bytes - 90 intents/s across 60 seats produced
    162 000 word_event frames in 30 s (5 400 frames/s) because every evaluated
    intent is broadcast to every seat, and word events are only about 29 bytes
    each, so an optimisation that lowers bytes without lowering frames has not
    addressed it. Verified: gofmt/vet clean, go test ./... 13/13 packages,
    go test -race ./... 0 races, hygiene 241/0, test-assets 6/0, monitoring 11/0,
    task-yaml 61/0, CI 6/6 green (the first run failed in 'Build image and smoke
    the compose stack' on a Docker Hub connection reset while pulling
    postgres:16-alpine - infrastructure, not code; re-ran the job and it passed).
  - >-
    Batch 32E (M2, PR #46, merged 1ce9aba): FIRST PvE CONTENT - the M2 row is
    closed. POST /v1/matches now takes "pve": true and creates a 1v1 in which
    the SERVER drives seat 1, so one player can play a real match with no
    second client, no second account and no tooling - the mode exists because
    that was the shortest path between a build that works and a game someone
    can try. It is a USER of product decision Q5 rather than an exception to
    it: the opponent is a declared bot, so the whole 32D disclosure chain
    applies unchanged (is_bot on the wire, is_bot in the HTTP state view, the
    delta change set, telemetry, and the durable result with
    bots=[1]/bot_present/rating_eligible=false) and the match can never be
    rating-eligible. TWO DESIGN PROPERTIES ARE THE WHOLE POINT. (1) The
    opponent is a CLIENT of the room, not part of the simulation: it calls
    Room.Submit, the same validated door a human uses, so there is no second
    rule set to keep in sync and a bug in it costs a word rather than producing
    an illegal board - a property the tests exercise rather than assume.
    (2) It is DETERMINISTIC as PD-003 requires: intent is a pure function of
    (snapshot, tick, dictionary, policy) - candidates sorted at load, cells in
    id order, no clock and no RNG - so a practice match replays and debugs like
    any other. The shipped policy is polite on purpose: 3-4 letter words, 45
    ticks (1.5 s) between them, and FREE CELLS ONLY, because the first PvE
    content teaches claiming before defending; an aggressive variant exists and
    is tested so difficulty is later a policy change with evidence, not a
    rewrite. Refusals name their reason: pve with any roster other than 1v1 is
    a 400 explaining the mode is 1v1 (and no silent re-sizing), pve on a
    deployment without WORDARENA_ALLOW_BOT_SEATS is a 400 naming that switch,
    and if the dictionary cannot supply words in the policy band the match is
    NOT created (discardRoom + 500) because a practice opponent that can never
    move is worse than an error. 12 new tests (7 in internal/pve, 5 end-to-end
    in cmd/game). One was worth the batch by itself: the aggressive policy
    variant produced an intent over cells the opponent already owned, which the
    simulation correctly rejected as blocked-by-rule, so the usable-cell rule
    now mirrors the game's own availability rule (unlocked AND not this seat's
    own). docs/M2-PVE.md is the design note; WIRE-PROTOCOL.md documents the
    field and the refusals; PRODUCT-DECISIONS.md gains Q11 (what the first
    practice mode is, and explicitly what it is not); ROADMAP.md row closed.
    Verified: gofmt/vet clean, go test ./... 12/12 packages, go test -race ./...
    0 races, hygiene 236/0, test-assets 6/0, monitoring 11/0, task-yaml 60/0,
    CI 6/6 green on a14a25c.
  - >-
    Batch 32D (M2, PR #45, merged dbcd8e0): PRODUCT DECISION Q5, decided by the
    agent on owner delegation 2026-09-14 and implemented the same day. Three
    clauses, each chosen because its opposite is a failure no later feature can
    undo. (1) A bot is DECLARED, never inferred - an absent profile is not
    bot-ness (anonymous humans, tooling seats and load-test seats all exist), so
    the server never guesses and can neither insult a human by marking them a
    bot nor deceive a player by marking a bot human. (2) The declaration is
    DISCLOSED on every surface, permanently: every seat's snapshot, deltas, the
    HTTP state view, telemetry, and the finished result; and no request field
    can CLEAR one, because a declaration only ever adds a disclosure. (3) A
    match containing a declared bot is NEVER rating- or reward-eligible, and the
    fact is DURABLE (infra/migrations/004_match_results_bots.sql - bots,
    bot_present, rating_eligible) because a rating is computed from the stored
    row possibly days later and after a restart; a flag that lived only in the
    room would be worthless exactly when it mattered. The decision also closed
    the backfill question NEGATIVELY rather than deferring it: under-filled
    lobbies are never topped up with silent opponents, so the human-only
    short-handed start (31C) remains the answer to low population - a small
    honest match beats a full dishonest one. Wire: PlayerState.is_bot (proto
    field 6), carried through snapshots AND deltas (a wire-visible field that
    could not be delivered would be an invisible correctness hole, so is_bot
    participates in the change set even though it never actually flips), plus
    the declaration in Match.Fingerprint so a substituted opponent cannot replay
    equal. Requests: bot_seats on create and the bot field on enqueue, both
    gated by WORDARENA_ALLOW_BOT_SEATS (default OFF, refusal names the switch)
    and validated against the roster; a bot may not bind a human profile. TWO
    OPERATIONAL CONSEQUENCES, both deliberate: headless-bot now declares itself
    on EVERY queue call with no suppression flag (the program IS a bot, and an
    undeclared bot in the queue was the one real masquerade path in the product,
    so the device-smoke partner now discloses itself to the Unity client instead
    of bypassing the policy), and a deployment hosting those legs must set
    WORDARENA_ALLOW_BOT_SEATS=true (docs/M1-OPS.md), which means the exit gate
    baselines 43:45 / 37:60 / 44:40 remain valid as physics but are now
    correctly recorded as non-rating-eligible bot matches. 8 new tests including
    the negatives that matter: no inference, no clearing, no backfill, stock
    deployment refuses.
  - >-
    Batch 32C (M2, PR #44, branch fa43ec9 rebased on 229f1bd): anti-snowball is
    implemented as an opt-in, deterministic, capped catch-up rule
    (docs/M2-ANTI-SNOWBALL.md). A seat at least CatchUpGap=25 points behind the
    leader earns half again on an accepted word, capped at CatchUpMaxBonus=15,
    with integer division and with the leader taken over NON-ELIMINATED seats
    only (a spectator's frozen score must not define how far behind the living
    are). Two design choices carry it. It is OFF by default, so no M0/M1
    baseline, replay, golden test, exit-gate score or device assertion moves.
    And the bonus is added to the SCORE and never to a cell's CreditedValue,
    because CreditedValue is what a later steal debits - folding it in would
    have re-priced every steal on the board, a much larger change than the one
    intended; TestCatchUpDoesNotRepriceSteals runs identical submissions with
    the rule off and on and requires the victim's two scores to differ by
    exactly the bonus, before and after being stolen from. The bonus is
    recorded in Event.CatchUpBonus and participates in Match.Fingerprint, so a
    replay can say WHY a score moved and a divergent bonus cannot replay equal.
    The constants are declared uncalibrated engineering defaults (Q1 treats M0
    numbers as calibration candidates), not tuned values. Board-side levers
    (leader lock duration, steal economics) and a combo cap are deliberately
    left for their own batches.
  - >-
    Batch 32B (M2, PR #43, merged 229f1bd): the roster size reaches the HTTP
    surface. The 60-player mode was fully implemented behind an endpoint that
    hard-coded two seats, so no client could ask for one. POST /v1/matches now
    accepts `seats` (absent or 0 = 1v1) and returns roster-shaped
    tokens/user_ids plus the `seats` it provisioned; 1v1 JSON is unchanged (a
    two-element array either way) so every existing client gets exactly the
    match it always got. Implementing it surfaced a decision the roadmap had not
    separated - is the knob a game capability or a deployment policy? Both, and
    conflating them would have been the expensive mistake: the game range
    (2..60, the Q10 cap) is a client error whatever the deployment offers,
    while the deployment range is WORDARENA_MAX_SEATS, defaulting to 2, because
    a 60-seat match created through an unauthenticated endpoint is 60 seat
    tokens and 60 WebSocket connections per request and the abuse review behind
    the current public exposure sized the creation limiter for a single
    developer. The refusal names the variable, so an operator limit is never
    reported as a game limit. player_ids above 1v1 is refused rather than
    half-honoured, and createRoomN range errors are now 400 rather than 500.
    Proven with a created 8-seat room driven over a real socket (seat 7 sees 8
    players on the 8-seat board) and the 60-seat maximum.
  - >-
    Batch 32A (M2, PR #42, merged 11c1ad6): state deltas close the "cut the
    BYTES on the wire" item - and the measurement overturns the assumption
    behind it. MatchStateDelta carries the scalars plus only the players and
    cells that differ from the frame it is based on. Per connection the
    transport remembers the last state_version it sent: a frame goes out as a
    delta only when that version equals the frame's base, otherwise the
    connection gets a full snapshot - one rule that covers dropped frames,
    reconnects, late joins and the first frame of a socket, with no client
    cooperation and no resync request. Deltas are scoped to rosters above two
    seats, so a 1v1 connection can only ever receive a full snapshot and the
    M0/M1 two-seat contract is unchanged byte for byte (same approach as Q10's
    board). protocol.ApplyDelta is the definition of the delta's meaning and the
    suite asserts it is proto.Equal - element order included - to the full
    snapshot of the same frame, at every frame of a driven 60-seat match;
    end-to-end over the real WebSocket the reconstruction is cross-checked
    against the word events. MEASURED: 1.7x on a saturated lobby (1463 -> 869
    B/frame, 1040 submissions accepted) and 2.2x on a typical one (1316 -> 603),
    i.e. 0.6-0.9 KB/s per client at 1 Hz. The churn breakdown in
    docs/LOAD-BASELINE.md shows why ~2x is the ceiling and not 10x: owner 19
    entries/frame, lock state 18, lock countdown 19, scores 11. The largest
    remaining saving (replacing the per-second lock countdown with a stable
    lock field, ~27% of the delta) changes a field the M1 client reads, so it is
    recorded as a follow-up in a client-contract change rather than hidden in a
    bandwidth batch. protoc IS now available in the sandbox (21.12 installed to
    /home/user/protoc21 with protoc-gen-go v1.36.5, verified byte-identical
    reproduction of the committed gen file before any change).
  - >-
    Batch 31C (M2, PR #41, merged 9524588): a partial Royale lobby now STARTS
    instead of stalling. A 30- or 60-seat queue cannot assume the whole roster
    arrives at once, so it would have expired everyone at queueTTL and the mode
    would never have been playable outside a load test. Once the
    LONGEST-WAITING player has waited lobbyFillWait (20 s) the lobby starts
    with whoever is present. Keying off the oldest entry rather than the newest
    is what bounds an individual player's wait - a trickle of late arrivals
    would otherwise postpone the start forever. A full roster still starts
    immediately, a lobby never starts with one player, languages stay isolated,
    and 1v1 has short-handed starts disabled entirely (fillWait zero), proven
    by waiting ten times the timeout with one player queued and then confirming
    normal pairing. Pairing also runs from the server's periodic sweep now:
    without that the timeout was unreachable in exactly the case it exists for,
    a lobby that stopped receiving arrivals. Clock is injected, so the 6 new
    tests are deterministic and sleep-free.
  - >-
    Batch 31B (M2, PR #40, merged d5881f2): broadcast frames are encoded ONCE
    per frame instead of once per subscriber, addressing the fan-out constraint
    batch 30F identified. A canonical snapshot is byte-for-byte identical for
    every seat, yet the transport re-rendered and re-marshalled it per
    connection, multiplying identical work by the roster size. matchroom.
    SharedPayload is a lazily encoded sync.Once box attached to each frame; all
    subscribers receive the same pointer, the first writer pays, and the room
    stays protocol-agnostic (it carries the box, the transport supplies the
    encoder). MEASURED on a 60-seat fan-out: ~906 us / 8 280 allocs ->
    ~15 us / 139 allocs, about 60x cheaper, recorded in docs/LOAD-BASELINE.md.
    Guarded by a RATIO test (>=10x in both time and allocations) so it does not
    depend on host speed and a revert to per-connection encoding fails CI.
    Safe under -race with 60 concurrent subscribers; a nil box still encodes.
    NOTE this cuts CPU and garbage, NOT bandwidth - each subscriber still
    receives the full snapshot.
  - >-
    Batch 31A (M2, PR #39, merged 735467d): the owner delegated Q9 and Q10 on
    2026-09-14, so both are now DECIDED, documented (docs/M2-ROYALE-RULES.md,
    register updated) and implemented. Q10: BoardCells(seats) is 12 for 1v1 and
    otherwise two cells per seat rounded to whole rows of six, capped at 60 (a
    6x10 grid = one cell per player at the maximum); the letter at cell i still
    depends only on (seed, language, wave), so a bigger board is a
    PREFIX-COMPATIBLE extension, the 1v1 board stays bit-identical to M0/M1 and
    a client can render before the lobby fills. The old "identical board at
    every roster" test was deliberately replaced by that stronger
    prefix-stability property. Q9: at each wave boundary the lowest scorers are
    culled to two thirds of the active roster (60 -> 40 -> 26), floored at 2,
    and never at all below EliminationMinSeats=4 so 1v1 and small lobbies are
    untouched; the cut uses only logged state (score desc, seat asc), a tie
    ACROSS the cut line keeps everyone (losing on seat number would be
    indefensible), eliminated seats become spectators whose intents are logged
    but rejected, and EliminatedAtWave is folded into Match.Fingerprint so a
    divergent cull cannot replay equal. A SECOND hidden 1v1 bug was found and
    fixed here: the steal rule computed the opponent as Seat(1-seat), so above
    two seats nobody past seat 1 could steal or be stolen from - Royale would
    have been parallel solitaire. Unity now derives grid width from the cell
    count (4 at 12 cells, 6 above) so gesture adjacency matches the renderer.
    11 new tests; the pre-existing suite passes unchanged (the 1v1
    non-regression evidence); 12/12 plus -race on match, matchroom, cmd/game.
  - >-
    Batch 30F (M2, PR #38, merged 52ca1a0): the cost of a match is now MEASURED
    as a function of roster size instead of assumed, and the two blockers were
    escalated into the decision register. TestRosterLoadBaseline plus six
    benchmarks at 2/8/16/30/60 seats show tick cost does NOT scale with the
    roster (tens of ns, dominated by the 12-cell board) while snapshot cost
    DOES, ~3x from 2 to 60 seats, because a snapshot renders every player; a
    60-seat match still simulates hundreds of thousands of times faster than
    real time on one core. The measurement is guarded, not merely logged: the
    test fails below x50 realtime or if tick cost grows more than 30x across
    the roster range. Conclusion recorded in docs/LOAD-BASELINE.md: the
    simulation is not the Royale constraint, snapshot FAN-OUT is (60
    subscribers x a 60-player snapshot is ~30x the bytes of a 1v1), which
    argues for delta or interest-scoped snapshots before the mode ships.
    docs/PRODUCT-DECISIONS.md gains Q9 (elimination rule - three candidate
    shapes, plus the constraint that elimination must be a deterministic
    function of logged state so replay equality survives) and Q10 (board
    sizing - CellsPerWave 12 is 1v1-sized, with the roster-independence,
    fan-out, MaxPathCells and 8-way adjacency constraints spelled out). Both
    OPEN and owner-facing.
  - >-
    Batch 30E (M2, PR #37, merged cef9160): replay determinism - the property
    anti-cheat and spectating rest on - now holds at roster scale, closing the
    verification gap left by 30A-30D. 40 randomized matches across 3, 5, 8 and
    16 seats are rebuilt from their event log alone and must agree event by
    event (result, score added, running total, steal flag), then on the full
    fingerprint and on EVERY seat's final score rather than the two busiest.
    The generated workload was measured before trusting it: 1797 events, 375
    scoring, across all 16 distinct seats, so the property is not passing
    vacuously. Second test pins that the roster does not leak into wave
    generation - an identical board at 2, 3, 7, 30 and 60 seats for wave 0 and
    for the lazily generated wave 1, without which a client could not render a
    board before the final roster is known. Suite 12/12; -race on match and
    cmd/game.
  - >-
    Batch 30D (M2, PR #36, merged 9c088fa): the roster work is now proven over
    the LIVE TRANSPORT, and doing so caught a real Royale-blocking bug.
    Room.SubmitWithSeq still carried a hard-coded 1v1 bound (seat > 1 was
    refused), so in any large roster every player except the first two would
    have been silently unable to play a word; 30A-30C did not catch it because
    they tested the roster API a layer above. The bound is now the room's own
    roster size, with a regression test walking all 7 seats of a 7-seat room
    plus both out-of-range cases. New end-to-end test: 8 clients connect over
    the real HTTP + WebSocket routes, all receive the identical board (and it
    is the same board the 1v1 fixture pins for that seed, so roster size does
    not perturb wave generation), every seat appears in every observer's
    snapshot, a word played by seat 5 is attributed to seat 5 for all eight
    observers with only that seat credited, all seats converge on the same
    state version and tick, and a token minted for another match is still
    refused at the handshake. Suite 12/12; -race on cmd/game, matchroom, match.
    LESSON recorded in the task file: every further roster change gets an
    end-to-end leg, because unit tests over the roster API missed a hard-coded
    bound one layer down.
  - >-
    Batch 30C (M2, PR #35, merged e164bd2): room PROVISIONING and queue
    ADMISSION are roster-shaped, which completes the seat-count-agnostic
    server stack begun in 30A/30B. createRoomN(lang, seed, playerIDs, seats,
    suddenDeath) validates seats against match.MinSeats/MaxSeats before
    allocating anything and refuses more player_ids than seats rather than
    truncating a roster; it mints one token and one non-zero synthetic user
    id per seat using matchID*seats+seatIndex+1, which reduces exactly to the
    old 1v1 id*2+1 / id*2+2 so no stored result or connected client changes
    meaning. createRoom survives as a two-seat wrapper, so no caller moved.
    createRoomFn now takes a []uint64 whose length IS the roster size;
    matchmaker gained seats (newMatchmakerWithSeats, clamped to >=2, default
    still 2) and pairLocked forms groups of that size in FIFO order, sharing
