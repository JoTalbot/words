resume_from: "M1 IS COMPLETE (all eight roadmap rows [x], device run 34782169182). M2 OPEN with THREE foundation batches merged: 30A (seat-count-agnostic simulation, bounds 2..60), 30B (roster-shaped room + seat-indexed SnapshotToProto), 30C (createRoomN + newMatchmakerWithSeats; PR #35, e164bd2). The server is now seat-count agnostic END TO END from simulation through room provisioning to queue admission, and the 1v1 path is byte-identical (synthetic ids matchID*seats+seat+1 reduce to id*2+1/id*2+2). DELIBERATELY NOT DONE: no HTTP endpoint exposes a seats parameter, because a public knob would ship an unplayable mode before the two product decisions. HUMAN DECISION REQUIRED BEFORE ROYALE GAMEPLAY: (1) the elimination rule - PlayerView.IsEliminated is always false; candidate shapes are a score floor per wave, a last-place cull per wave, or no elimination at all (pure scoring); (2) board sizing for a large roster - CellsPerWave is 12, sized for two players, and generateWave must stay deterministic per (seed, lang, wave). Both are tracked as OPEN entries in docs/PRODUCT-DECISIONS.md; anti-snowball and bot disclosure (the remaining M2 rows) depend on them. Batch 30D is also merged (8-seat e2e over the live transport; it caught and fixed a hard-coded seat>1 bound in Room.SubmitWithSeq). Batch 30E is also merged (replay determinism at 3/5/8/16 seats plus roster-independent board generation). The roster is now proven at all three layers: simulation (30E replay), room (30D regression) and transport (30D e2e). Batch 30F is also merged (cost model measured at 2..60 seats; Q9/Q10 filed in the register). THE ENGINEERING HALF OF THE 60-PLAYER ROW IS COMPLETE - do not re-open it looking for more roster plumbing. NEXT UNBLOCKED WORK, if Q9/Q10 are still unanswered: delta or interest-scoped snapshots (justified independently by the 30F fan-out finding and needed by Royale whatever the sizing answer is); otherwise move to another M2 row that does not depend on Royale. matchmaker fairness/starvation behaviour when a partial lobby never fills (currently players wait forever - a lobby timeout with bot backfill is engineering, but WHO backfills is product). OPS: the Q8 quick-tunnel URL is EPHEMERAL - repo variable WORDS_SERVER_URL was set 2026-09-13 to https://ireland-placement-dot-inner.trycloudflare.com and must be refreshed after a tunnel restart, or the scheduled device run skips the 28b full-match leg (it never weakens the smoke). Q8 stage 2 (stable domain) and B2 (uk dictionary licence) remain owner items. Housekeeping: git identity Word Arena Agent agent@jotalbot.local; Unity dispatch needs ref=main AND explicit inputs (run_smoke_tests + server_url); git commit -F for backticks; THE SANDBOX HOME CAN BE WIPED BETWEEN TURNS - recover with git init + remote add + fetch + reset --hard origin/main inside the leftover dir (clone refuses a non-empty dir), re-set git identity, re-download Go to /home/user/go, chmod 600 the OCI key."







