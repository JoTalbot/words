resume_from: "M1 COMPLETE (8/8). M2: ALL SIX ROWS ARE NOW CLOSED - the 60-player row (32A/32B/32D), first PvE content (32E), infrastructure load testing (32F) and guild foundation (32G), with anti-snowball marked [~] because its constants are deliberately uncalibrated. Merged 2026-09-14: 32A 11c1ad6, 32B 229f1bd, 32C 547243f, 32D dbcd8e0, 32E 1ce9aba, 32F 4477798, 32G 24b87a0. Q5/Q9/Q10/Q11/Q12 are DECIDED - do NOT re-open any of them. SEVEN FACTS A FUTURE SESSION MUST NOT RE-LITIGATE: (1) wire bytes were never the 60-player blocker - deltas buy about 2x, and the cost is MEASURED: 163-178 B/s per 1v1 client, about 900 B/s per full-lobby client, about 50 KB/s per lobby. (2) The seats knob is both a game capability (2..60) and a deployment policy (WORDARENA_MAX_SEATS, default 2, named in the refusal). (3) Anti-snowball is OPT_IN and its bonus must NEVER be folded into a cell's CreditedValue, because CreditedValue is what a steal debits. (4) A bot is DECLARED, never inferred; a client cannot clear the declaration; a bot match is never rating-eligible; the QA legs declare themselves so a deployment hosting them needs WORDARENA_ALLOW_BOT_SEATS=true. (5) The practice opponent is a CLIENT of the room (Room.Submit) and its intent is a pure function of (snapshot, tick, dictionary, policy). (6) A full lobby's real cost is FRAMES not bytes (intents x seats), and rooms OUTLIVE their clients (drain 180.2 s), so capacity is creations/s x 180 s - after the per-caller mutation limit (WORDARENA_MUTATIONS_PER_MIN, default 120/min) which answers a burst with 429 long before the box does. (7) Guild mutations authenticate with a per-profile OWNER TOKEN (returned once at profile creation, stored only as a SHA-256 hash); no endpoint trusts a caller-supplied player id; profiles created before 32G cannot use guilds and there is deliberately no way to mint a token for them. NEXT WORK, in order: (a) PROTOCOL-VERSION DEBT - CLOSED in batch 33 (0b71946, 2026-09-14): version + capabilities handshake on the connect path; (b) anti-snowball calibration by simulation rather than guess (PD-007); (c) security review of the NEW surfaces (owner token, guild rate limits, pve field) extending docs/SECURITY-REVIEW-M1.md; (d) PvE follow-ups (difficulty, rewards, tutorial framing); (e) load-testing follow-ups (Postgres stage, generator off-box, per-seat intent limit). OWNER ITEMS: Q8 stage 2 needs a domain; B2 (uk dictionary licence) is confirmed to exist and arrive later and NOTHING waits on it. RECOVERY: the sandbox home is wiped between turns - re-clone from GitHub (a partial snapshot can leave a words/ directory without .git; move it aside and clone fresh), re-create ~/.ssh/oci_server_key.pem, and note that a PARTIAL snapshot also strips the executable bit from toolchain binaries (chmod +x /home/user/go-toolchain/go/bin/* and /home/user/protoc21/bin/protoc and /home/user/gopath/bin/protoc-gen-go, or reinstall Go to /home/user/go-toolchain); USE A FRESH GOMODCACHE (/home/user/go/pkg/mod) because the persisted module cache is truncated and produces 'no required module provides package ...' errors that look like a go.mod problem. THE GITHUB TOKEN IS RECOVERABLE from the OCI host: ssh -i ~/oci_server_key.pem ubuntu@129.213.177.56 cat ~/.git-credentials"
