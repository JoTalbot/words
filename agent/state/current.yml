    Unity Android run 34767504356 / 07aa6e6 (27E env NRE fix, head
    07aa6e6, dispatched 16:04Z): build green; BOTH legs failed, but the
    client was finally healthy - [WORDS_SERVER] source=default, board
    rect published 1.6 s after ready (x=40..1004 y=662..1148 cells=12),
    swipe planned inside row 0 (y=743). The failure is a NEW class:
    Unity windowFocusChanged true at launch, false 0.5 s later, never
    true again - the app rendered (screenshot: full UI, no sheet) but
    the swipe produced no WORDS_SWIPE while dumpsys reported our window
    focused. Root cause: Unity's input gate stuck at 'unfocused' after a
    first-boot focus flap; dumpsys alone is not swipe-readiness. Fixed
    in batch 27F (ac650b0) with the [WORDS_FOCUS] marker + forced focus
    cycle + full-restart retry.
  - >-
    Unity Android run 34764775012 (head c2add29): FIRST green integrated
    build, but both device legs failed with a new signature - client ready
    (SetGameState isLoading=false), then 122-143 s of client silence (no
    WORDS_BOARD_RECT, where the healthy 08:15Z run logged it within 0.14 s)
    and no WORDS_SWIPE even from the fallback row y=880 that produced the
    green run 34683472147. Leg 35 screenshot: NullReferenceException in
    the Unity development console over a black app area (OnGUI loop killed)
    + the ImmersiveModeConfirmation sheet in front; the launch focus gate
    had passed ~0.13 s before the sheet appeared (gate and dumpsys
    disagreed). Leg 33 had clean focus and the same silence, so the NRE is
    the primary suspect. The static audit of the c72ce73..c2add29 client
    diff found no reference-unsafe per-frame path - hence batch 27D
    (instrumentation) rather than a guessed fix.
  - >-
    Unity Android build failures on the integrated batch 27/28 main, both
    our own C# caught by the CI compile gate (kept as evidence the gate
    earns its place): run 34763722090 (head 97dae4d) failed on batch 27B -
    CS0117 Application.arguments (absent from Unity 6's netstandard shim)
    and CS0029 Environment.GetEnvironmentVariable returning ReadOnlySpan<char>;
    fixed in 140701b (PR #22) by dropping the argument channel (the file
    channel is the practical Android automation path) and reading env via
    .ToString(). Run 34764363334 (head 7968137) then failed on batch 28a -
    CS1503 Color32 takes bytes, Mathf.RoundToInt returns int; fixed in
