    batch_38e: "MERGED via PR #66 -> 791b622. Task 38E required a decision before code because closing a socket is a client-visible contract. Decision: keep the behaviour, make the contract state it. docs/WIRE-PROTOCOL.md section 9 now says explicitly that the server removes the room ~3 s after the terminal frame and does NOT close the already-open socket - the connection lives until one side closes it, and the outcome is available from the terminal frame plus the durable result endpoint. A server-initiated 1000/1001 close was evaluated and declined for M2 (no correctness gain, real client-contract risk). Section 3.1 cross-references it. No code changed."
