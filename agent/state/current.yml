  - "18: GitHub REST merge via API works with the token in ~/.git-credentials (never write the token into the repo). Check-runs on a merge commit can lag ~1-2 min; poll before reporting green"
  - "20: kill long-running test servers by EXACT PID files only - a pkill -f pattern during a repro setup once matched and stopped a soak server too (both paths end in wordarena)"
  - "21 (new 2026-09-17): a websocket subscriber in delta mode receives the initial snapshot and then deltas forever - there is no periodic full snapshot to fall back on. Anything that reads state from the wire (client, bot, load harness) must apply deltas or it will fly a frozen board; this is the defect 38C fixed in the load harness"
  - "22 (new 2026-09-17): agent/state/current.yml is load-bearing and was unguarded for most of its life. A rewrite can delete required keys and still parse as valid YAML; the only detector is tools/check-state-yaml.py in Container smoke - run it locally before committing this file instead of trusting that green CI means the gate passed"
  - "23 (new 2026-09-17): fuzzy text replacement can silently corrupt a Go file (one edit attempt in api.go produced two splices - a comment tail and a duplicated function tail at EOF). Diff after every scripted edit; repair is git checkout plus deterministic python replacement with an assertion per replacement"
  - "24 (new 2026-09-24): an isolated proof instance must bind with WORDARENA_ADDR, not ADDR - the bare ADDR env is ignored and the server falls back to port 8080, which will collide with a co-tenant. Also the Arena-pasted RSA key needed a one-char base64 repair before ssh-keygen accepted it (validate hand-copied keys with full RSA math: p times q equals n and e times d mod lcm equals 1) before trusting a hand-copied credential"
  - "25 (new 2026-09-25): the Arena workspace snapshot does not persist .git/config, so the origin remote disappears between sessions - git fetch origin must be preceded by git remote add origin https://github.com/JoTalbot/words.git (public repo, no credential needed for READ) and the per-push inline token URL is safest for WRITE"

