    stray blank line dropped in an import block); fp.go is on the deterministic fingerprint
    path so it was re-validated against the golden and byte-stability tests rather than
    assumed safe. Cross-checked that gofmt 1.24.13 (what CI installs) and 1.27.1 both report
    0 files, so the gate cannot fail on a formatter version difference (PR #13, a4b0de8)
