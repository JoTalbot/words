    DEFECT FOUND BY LIVE RE-VERIFICATION (fixed in PR #7, branch
    fix/m1-batch22a-id-monotonicity at ea6a405): match ids restart at 1 while
    match_results is keyed by match_id, so after a restart (a) reads of a live
    match returned a previous match's result/replay - infra/smoke.sh caught it
    as replay 404 expected / 200 got - and (b) the new match's own result was
    silently dropped by ON CONFLICT DO NOTHING. NewAPIWithPostgres now resumes
    the counter from MAX(match_id) and refuses to start if that read fails;
    TestAliasingReproducesWithoutPriming pins the bug,
    TestMatchIDsDoNotAliasAcrossRestarts the fix. CI structurally cannot catch
    this class (every run starts from an empty database) - which is the
    argument for keeping live re-verification in the loop.
