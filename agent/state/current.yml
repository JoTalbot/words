    Batch 25 (M1 security): closed docs/SECURITY-REVIEW-M1.md finding S-2. GET
    /v1/matches/{id}/result and /replay were unauthenticated and keyed by a monotonic
    counter, so a one-line loop read the final score, winner and full word-by-word event
    log of every finished match. createRoom now issues a 128-bit match code and a 128-bit
    read capability per match from crypto/rand, migration 003 stores both with the result,
    and WORDARENA_REQUIRE_READ_CAPABILITY=true refuses the sequential-id form with 404 and
    requires the capability on the code form. The capability is stored rather than kept in
    process state precisely so the batch 8 restart criterion survives the gate. Deployed to
    OCI and verified live (PR #11, dfb7c1a)
  - >-
    Batch 25 also corrected the schema drift guard, which compared the service schema
    against 001_init.sql alone and would therefore have failed the build on the first
    migration that added a column even with service and migrations in perfect agreement. It
    now folds every later ADD COLUMN into the comparison, with two tests proving the
    loosened check still detects drift
  - >-
    Batch 24 (M1): closed M1-batch22b. The harness asserted proto.Equal on the two first
    WebSocket frames of a match, but the room starts its 30 Hz ticker when it is created
    (api.go:643) and serves each socket a snapshot on connect (api.go:1163), so two sockets
    dialed sequentially legitimately receive different server_tick, state_version and
    remaining_time_ms - and different boards if a wave boundary falls between the connections.
    The check now compares the game and ignores the clock; the offline planner's uncoverable
    board became a typed SKIP instead of a FAIL. 98 queue matches after the change: 93
    measured, 0 divergence failures, 5 planner skips, 0 failures (PR #10, 4a99e82)
  - >-
    Batch 23A (M1): fixed a live data-loss defect - match_results declared match_id and seed BIGINT
    while the service models both as Go uint64, so every value above MaxInt64 failed at pgx encode
    time and the durable result row was silently dropped for roughly half of all matches. Migration
    002_match_results_uint64.sql widens both to NUMERIC(20,0); u64Param/scanU64 own the
    representation. Found in the live journal, reproduced against pre-fix code with the exact
    production error string, deployed to OCI and re-verified live (PR #8, 0ef97c5 -> 5653210)
  - >-
    Batch 23A also made the Postgres suite re-runnable: TestPostgresResultPutGet hard-coded
