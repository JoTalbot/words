  - >-
    Batch 27B (endpoint persistence, PR #19 merged + PR #22 Unity 6 compile
    fix, 7968137): the serverUrl field gets PlayerPrefs persistence
    (words.server_url, saved on value change) plus startup resolution with
    documented precedence and a [WORDS_SERVER] url=... source=... marker.
    The first version failed the Unity build (run 34763722090): Unity 6's
    netstandard shim has no Application.arguments property (CS0117) and its
    Environment.GetEnvironmentVariable returns ReadOnlySpan<char> (CS0029).
    The fix drops the argument channel (the file channel
    <persistentDataPath>/server_url.txt via adb push + run-as is the
    practical Android automation path anyway) and reads env via .ToString(),
    which compiles against both the shim and the BCL. Final precedence:
    env > file > PlayerPrefs > loopback default.
