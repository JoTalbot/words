# Local M0 dev environment for the game service.
#   docker compose -f infra/docker-compose.yml up --build
# The service is then reachable at http://127.0.0.1:18080 (healthz, metrics,
# match creation). WebSocket play uses ws://127.0.0.1:18080/v1/match/ws.
services:
  game:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    image: wordarena-game:local
    ports:
      - "18080:8080"
    environment:
      WORDARENA_ADDR: ":8080"
      WORDARENA_MAX_ROOMS: "128"
      WORDARENA_MAX_WS_BYTES: "65536"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
