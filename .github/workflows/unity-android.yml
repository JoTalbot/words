name: Unity Android

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: Build flavor
        required: true
        type: choice
        options:
          - debug
          - release
        default: debug
      run_smoke_tests:
        description: Install and launch the APK on a hosted x86_64 Android emulator
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  actions: write

concurrency:
  group: unity-android-${{ github.ref }}
  cancel-in-progress: true

env:
  UNITY_VERSION: 6000.0.59f2
  PROJECT_PATH: client/unity

jobs:
  preflight:
    name: Validate Unity project
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate tracked project files
        shell: bash
        run: |
          set -euo pipefail
          test -f "$PROJECT_PATH/ProjectSettings/ProjectVersion.txt"
          grep -q '^m_EditorVersion: 6000.0.59f2$' "$PROJECT_PATH/ProjectSettings/ProjectVersion.txt"
          test -f "$PROJECT_PATH/Packages/manifest.json"
          test -f "$PROJECT_PATH/Packages/packages-lock.json"
          test -f "$PROJECT_PATH/Assets/Editor/BuildCommand.cs"
          test -f "$PROJECT_PATH/Assets/Scenes/Main.unity"
          test -f "$PROJECT_PATH/Assets/Scripts/WordArenaBootstrap.cs"
          test -f "$PROJECT_PATH/Assets/Scripts/WordArenaBootstrap.cs.meta"
          test -f "$PROJECT_PATH/Assets/Scripts/WordArenaProtocol.cs"
          test -f "$PROJECT_PATH/Assets/Scripts/WordArenaProtocol.cs.meta"
          test -f "$PROJECT_PATH/Assets/Scripts/WordArenaNetworkClient.cs"
          test -f "$PROJECT_PATH/Assets/Scripts/WordArenaNetworkClient.cs.meta"
          grep -q 'RuntimeInitializeOnLoadMethod' "$PROJECT_PATH/Assets/Scripts/WordArenaBootstrap.cs"
          grep -q 'authoritative Go' "$PROJECT_PATH/Assets/Scripts/WordArenaBootstrap.cs"
          grep -q 'TryDecodeServerEnvelope' "$PROJECT_PATH/Assets/Scripts/WordArenaProtocol.cs"
          grep -q 'EncodeSubmitWord' "$PROJECT_PATH/Assets/Scripts/WordArenaProtocol.cs"
          grep -q 'ClientWebSocket' "$PROJECT_PATH/Assets/Scripts/WordArenaNetworkClient.cs"
          grep -R 'UnityEngine\.UI\|UnityEngine\.EventSystems' "$PROJECT_PATH/Assets/Scripts" && exit 1 || true
          test -f docs/unity-ci.md
          test -f docs/android-build.md
          test -f docs/unity-server-architecture.md

      - name: Validate JSON
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool "$PROJECT_PATH/Packages/manifest.json" >/dev/null
          python3 -m json.tool "$PROJECT_PATH/Packages/packages-lock.json" >/dev/null

  build:
    name: Build Android ${{ inputs.build_type }}
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      # NOTE: image tag is literal — the `env` context is not resolved inside
      # `jobs.<job_id>.container`, and a templated tag fails workflow validation.
      image: unityci/editor:ubuntu-6000.0.59f2-android-3.2.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Validate Unity activation secrets
        shell: bash
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${UNITY_EMAIL:-}" || { echo 'Missing UNITY_EMAIL GitHub Secret'; exit 1; }
          test -n "${UNITY_PASSWORD:-}" || { echo 'Missing UNITY_PASSWORD GitHub Secret'; exit 1; }
          echo 'Personal (free) activation via Unity account (Unity 6: .ulf manual activation was removed for Personal seats).'

      - name: Validate release signing secrets
        if: ${{ inputs.build_type == 'release' }}
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEYALIAS_NAME: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          ANDROID_KEYALIAS_PASS: ${{ secrets.ANDROID_KEYALIAS_PASS }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASS ANDROID_KEYALIAS_NAME ANDROID_KEYALIAS_PASS; do
            [[ -n "${!name:-}" ]] || { echo "Missing $name GitHub Secret for release build"; exit 1; }
          done

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: ${{ env.PROJECT_PATH }}/Library
          key: unity-library-${{ env.UNITY_VERSION }}-android-${{ hashFiles('client/unity/Assets/**', 'client/unity/Packages/**', 'client/unity/ProjectSettings/**') }}
          restore-keys: |
            unity-library-${{ env.UNITY_VERSION }}-android-

      - name: Activate Unity Personal license (email/password)
        shell: bash
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          set -euo pipefail
          LIC_CLIENT=/opt/unity/Editor/Data/Resources/Licensing/Client/Unity.Licensing.Client
          mkdir -p /root/.local/share/unity3d/Unity /root/.config/unity3d/Unity/licenses

          ATTEMPTS=4
          DELAY=20
          ACTIVATED=0
          for ATTEMPT in $(seq 1 "$ATTEMPTS"); do
            echo "=== Activating Unity Personal (attempt $ATTEMPT/$ATTEMPTS) ==="
            if "$LIC_CLIENT" --activate-all --include-personal \
                 --username "$UNITY_EMAIL" --password "$UNITY_PASSWORD" 2>&1 | tee /tmp/activation.log; then
              echo "Personal activation succeeded."
              ACTIVATED=1
              break
            fi

            if grep -q "Invalid Credential" /tmp/activation.log; then
              echo "Unity rejected the credentials (Invalid Credential, code 143.002)."
              echo "Fix UNITY_EMAIL / UNITY_PASSWORD secrets:"
              echo "  - correct email + password as on id.unity.com"
              echo "  - email must be verified"
              echo "  - account must NOT be Google/Apple-SSO-only (a Unity password must exist)"
              echo "  - no MFA/2FA on the automation account"
              exit 1
            fi

            if [ "$ATTEMPT" -lt "$ATTEMPTS" ]; then
              echo "Transient activation failure; retrying in ${DELAY}s..."
              sleep "$DELAY"
              DELAY=$((DELAY * 2))
            fi
          done

          if [ "$ACTIVATED" -ne 1 ]; then
            echo "Unity Personal activation failed after $ATTEMPTS attempts."
            tail -40 /tmp/activation.log || true
            exit 1
          fi

          # Verify a license landed. GitHub Actions container jobs run with
          # HOME=/github/home, so the entitlement file lives under $HOME, not
          # /root. The client's exit code is authoritative (same as game-ci);
          # this check is informational only.
          LIC=$(find "$HOME" /root /usr/share/unity3d \
            \( -name '*.ulf' -o -name '*.xml' \) 2>/dev/null | head -1 || true)
          if [ -n "$LIC" ]; then
            echo "License file present: $LIC"
          else
            echo "NOTE: licensing client reported success; no .ulf/.xml found in the"
            echo "searched paths (HOME=$HOME). Proceeding - the build step is the gate."
          fi

          echo "=== Completing license binding in batchmode ==="
          unity-editor -batchmode -nographics -quit -logFile /tmp/unity_init.log || true

      - name: Build APK with Unity editor (in-container)
        working-directory: ${{ env.PROJECT_PATH }}
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="Builds/Android/words-${{ inputs.build_type }}.apk"
          echo "=== Building ${{ inputs.build_type }} APK ==="
          if unity-editor -batchmode -nographics -quit \
              -projectPath . \
              -executeMethod Words.BuildCommand.BuildAndroid \
              -buildType "${{ inputs.build_type }}" \
              -buildPath "$APK_PATH" \
              -logFile /tmp/unity_build.log; then
            echo "Build succeeded."
          else
            echo "=== Unity build failed; last 200 log lines ==="
            tail -200 /tmp/unity_build.log || true
            exit 1
          fi
          test -f "$APK_PATH" || { echo "APK not found at $APK_PATH"; exit 1; }
          ls -la "$(dirname "$APK_PATH")"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: words-android-${{ inputs.build_type }}
          if-no-files-found: error
          path: |
            ${{ env.PROJECT_PATH }}/Builds/Android/*.apk

  smoke:
    name: Android emulator smoke test
    if: ${{ inputs.run_smoke_tests == true }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: words-android-${{ inputs.build_type }}
          path: artifact

      - name: Install and launch on hosted emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          # disable-animations triggers `settings put` right after boot, which
          # flakes on API 35 x86_64 ("Broken pipe (32)"). The smoke test below
          # does not need animations disabled.
          disable-animations: false
          script: |
            # android-emulator-runner splits the script into single lines and
            # runs each with a separate `sh -c` (script-parser.ts), so state
            # does not persist across lines: chain the whole smoke flow on one
            # line with &&. Backend marker: ANDROID_BACKEND=github-hosted-emulator.
            apk=$(find artifact -name '*.apk' -type f | head -1) && test -n "$apk" && adb install -r "$apk" && adb shell monkey -p com.jotalbot.words 1 && adb shell pm path com.jotalbot.words
