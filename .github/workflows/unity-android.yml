name: Unity Android

on:
  # Manual build/smoke is the primary entry point. The schedule exists because
  # the hosted emulator pool flakes independently of our code (four failed
  # runs on 2026-09-10, all in adb/emulator plumbing); a scheduled retry turns
  # "someone must re-dispatch it" into automatic recovery, and it re-verifies
  # the device gesture smoke on the current main.
  schedule:
    - cron: "17 3,15 * * *"
  workflow_dispatch:
    inputs:
      build_type:
        description: Build flavor
        required: true
        type: choice
        options:
          - debug
          - release
        default: debug
      run_smoke_tests:
        description: Install and launch the APK on a hosted x86_64 Android emulator
        required: true
        type: boolean
        default: false
      emulator_api_level:
        description: API level for the first emulator attempt (the retry leg always uses 33)
        required: false
        type: choice
        options:
          - "35"
          - "34"
        default: "35"

permissions:
  contents: read
  actions: write

concurrency:
  group: unity-android-${{ github.ref }}
  cancel-in-progress: true

env:
  UNITY_VERSION: 6000.0.59f2
  PROJECT_PATH: client/unity

jobs:
  setup:
    name: Resolve run configuration
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      build_type: ${{ steps.cfg.outputs.build_type }}
      run_smoke: ${{ steps.cfg.outputs.run_smoke }}
      api_level: ${{ steps.cfg.outputs.api_level }}
    steps:
      - name: Resolve
        id: cfg
        run: |
          # A `schedule` event has no `inputs`, so every dispatch input needs a
          # default here. Without this the nightly device smoke silently skipped
          # itself (job `if` saw inputs.run_smoke_tests == null) and the flake
          # self-heal looked working while doing nothing.
          build_type="${{ inputs.build_type }}"
          [ -n "$build_type" ] || build_type=debug
          run_smoke="${{ inputs.run_smoke_tests }}"
          if [ "${{ github.event_name }}" = "schedule" ]; then run_smoke=true; fi
          case "$run_smoke" in true|*) ;; esac
          [ "$run_smoke" = "true" ] || run_smoke=false
          api_level="${{ inputs.emulator_api_level }}"
          [ -n "$api_level" ] || api_level=35
          echo "build_type=$build_type"
          echo "run_smoke=$run_smoke"
          echo "api_level=$api_level"
          {
            echo "build_type=$build_type"
            echo "run_smoke=$run_smoke"
            echo "api_level=$api_level"
          } >> "$GITHUB_OUTPUT"

  preflight:
    name: Validate Unity project
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate tracked project files
        shell: bash
        run: |
          set -euo pipefail
          test -f "$PROJECT_PATH/ProjectSettings/ProjectVersion.txt"
          grep -q '^m_EditorVersion: 6000.0.59f2$' "$PROJECT_PATH/ProjectSettings/ProjectVersion.txt"
          test -f "$PROJECT_PATH/Packages/manifest.json"
          test -f "$PROJECT_PATH/Packages/packages-lock.json"
          test -f "$PROJECT_PATH/Assets/Editor/BuildCommand.cs"
          test -f "$PROJECT_PATH/Assets/Scenes/Main.unity"
          test -f "$PROJECT_PATH/Assets/Scripts/WordArenaBootstrap.cs"
          test -f "$PROJECT_PATH/Assets/Scripts/WordArenaBootstrap.cs.meta"
          test -f "$PROJECT_PATH/Assets/Scripts/WordArenaProtocol.cs"
          test -f "$PROJECT_PATH/Assets/Scripts/WordArenaProtocol.cs.meta"
          test -f "$PROJECT_PATH/Assets/Scripts/WordArenaNetworkClient.cs"
          test -f "$PROJECT_PATH/Assets/Scripts/WordArenaNetworkClient.cs.meta"
          grep -q 'RuntimeInitializeOnLoadMethod' "$PROJECT_PATH/Assets/Scripts/WordArenaBootstrap.cs"
          grep -q 'authoritative Go' "$PROJECT_PATH/Assets/Scripts/WordArenaBootstrap.cs"
          grep -q 'TryDecodeServerEnvelope' "$PROJECT_PATH/Assets/Scripts/WordArenaProtocol.cs"
          grep -q 'EncodeSubmitWord' "$PROJECT_PATH/Assets/Scripts/WordArenaProtocol.cs"
          grep -q 'ClientWebSocket' "$PROJECT_PATH/Assets/Scripts/WordArenaNetworkClient.cs"
          grep -q 'CheckReadyz' "$PROJECT_PATH/Assets/Scripts/WordArenaNetworkClient.cs"
          grep -q 'RotateSeatToken' "$PROJECT_PATH/Assets/Scripts/WordArenaNetworkClient.cs"
          grep -q 'FetchResult' "$PROJECT_PATH/Assets/Scripts/WordArenaNetworkClient.cs"
          grep -q 'RedactedUri' "$PROJECT_PATH/Assets/Scripts/WordArenaNetworkClient.cs"
          grep -q 'Ready check' "$PROJECT_PATH/Assets/Scripts/WordArenaBootstrap.cs"
          grep -q 'Rotate token' "$PROJECT_PATH/Assets/Scripts/WordArenaBootstrap.cs"
          grep -q 'Fetch result' "$PROJECT_PATH/Assets/Scripts/WordArenaBootstrap.cs"
          grep -q 'PendingIntentViewModel' "$PROJECT_PATH/Assets/Scripts/WordArenaBootstrap.cs"
          grep -q 'ReconcilePendingWithSnapshot' "$PROJECT_PATH/Assets/Scripts/WordArenaBootstrap.cs"
          grep -q 'Prediction rolled back' "$PROJECT_PATH/Assets/Scripts/WordArenaBootstrap.cs"
          # Batch 26D: the device smoke swipes where the client says the board
          # is. Pin both halves of that contract so one side cannot drift.
          grep -q 'WORDS_BOARD_RECT' "$PROJECT_PATH/Assets/Scripts/WordArenaBootstrap.cs"
          grep -q 'WORDS_BOARD_RECT' tools/android-smoke.sh
          grep -R 'UnityEngine\.UI\|UnityEngine\.EventSystems' "$PROJECT_PATH/Assets/Scripts" && exit 1 || true
          grep -q 'tools/android-smoke.sh' .github/workflows/unity-android.yml
          test -f tools/android-smoke.sh
          grep -q 'ANDROID_BACKEND' tools/android-smoke.sh
          test -f docs/unity-ci.md
          test -f docs/android-build.md
          test -f docs/unity-server-architecture.md

      - name: Validate JSON
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool "$PROJECT_PATH/Packages/manifest.json" >/dev/null
          python3 -m json.tool "$PROJECT_PATH/Packages/packages-lock.json" >/dev/null

  build:
    name: Build Android ${{ needs.setup.outputs.build_type }}
    needs: [preflight, setup]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      # NOTE: image tag is literal — the `env` context is not resolved inside
      # `jobs.<job_id>.container`, and a templated tag fails workflow validation.
      image: unityci/editor:ubuntu-6000.0.59f2-android-3.2.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Validate Unity activation secrets
        shell: bash
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${UNITY_EMAIL:-}" || { echo 'Missing UNITY_EMAIL GitHub Secret'; exit 1; }
          test -n "${UNITY_PASSWORD:-}" || { echo 'Missing UNITY_PASSWORD GitHub Secret'; exit 1; }
          echo 'Personal (free) activation via Unity account (Unity 6: .ulf manual activation was removed for Personal seats).'

      - name: Validate release signing secrets
        if: ${{ needs.setup.outputs.build_type == 'release' }}
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEYALIAS_NAME: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          ANDROID_KEYALIAS_PASS: ${{ secrets.ANDROID_KEYALIAS_PASS }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASS ANDROID_KEYALIAS_NAME ANDROID_KEYALIAS_PASS; do
            [[ -n "${!name:-}" ]] || { echo "Missing $name GitHub Secret for release build"; exit 1; }
          done

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: ${{ env.PROJECT_PATH }}/Library
          key: unity-library-${{ env.UNITY_VERSION }}-android-${{ hashFiles('client/unity/Assets/**', 'client/unity/Packages/**', 'client/unity/ProjectSettings/**') }}
          restore-keys: |
            unity-library-${{ env.UNITY_VERSION }}-android-

      - name: Activate Unity Personal license (email/password)
        shell: bash
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          set -euo pipefail
          LIC_CLIENT=/opt/unity/Editor/Data/Resources/Licensing/Client/Unity.Licensing.Client
          mkdir -p /root/.local/share/unity3d/Unity /root/.config/unity3d/Unity/licenses

          ATTEMPTS=4
          DELAY=20
          ACTIVATED=0
          for ATTEMPT in $(seq 1 "$ATTEMPTS"); do
            echo "=== Activating Unity Personal (attempt $ATTEMPT/$ATTEMPTS) ==="
            if "$LIC_CLIENT" --activate-all --include-personal \
                 --username "$UNITY_EMAIL" --password "$UNITY_PASSWORD" 2>&1 | tee /tmp/activation.log; then
              echo "Personal activation succeeded."
              ACTIVATED=1
              break
            fi

            if grep -q "Invalid Credential" /tmp/activation.log; then
              echo "Unity rejected the credentials (Invalid Credential, code 143.002)."
              echo "Fix UNITY_EMAIL / UNITY_PASSWORD secrets:"
              echo "  - correct email + password as on id.unity.com"
              echo "  - email must be verified"
              echo "  - account must NOT be Google/Apple-SSO-only (a Unity password must exist)"
              echo "  - no MFA/2FA on the automation account"
              exit 1
            fi

            if [ "$ATTEMPT" -lt "$ATTEMPTS" ]; then
              echo "Transient activation failure; retrying in ${DELAY}s..."
              sleep "$DELAY"
              DELAY=$((DELAY * 2))
            fi
          done

          if [ "$ACTIVATED" -ne 1 ]; then
            echo "Unity Personal activation failed after $ATTEMPTS attempts."
            tail -40 /tmp/activation.log || true
            exit 1
          fi

          # Verify a license landed. GitHub Actions container jobs run with
          # HOME=/github/home, so the entitlement file lives under $HOME, not
          # /root. The client's exit code is authoritative (same as game-ci);
          # this check is informational only.
          LIC=$(find "$HOME" /root /usr/share/unity3d \
            \( -name '*.ulf' -o -name '*.xml' \) 2>/dev/null | head -1 || true)
          if [ -n "$LIC" ]; then
            echo "License file present: $LIC"
          else
            echo "NOTE: licensing client reported success; no .ulf/.xml found in the"
            echo "searched paths (HOME=$HOME). Proceeding - the build step is the gate."
          fi

          echo "=== Completing license binding in batchmode ==="
          unity-editor -batchmode -nographics -quit -logFile /tmp/unity_init.log || true

      - name: Build APK with Unity editor (in-container)
        working-directory: ${{ env.PROJECT_PATH }}
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="Builds/Android/words-${{ needs.setup.outputs.build_type }}.apk"
          echo "=== Building ${{ needs.setup.outputs.build_type }} APK ==="
          if unity-editor -batchmode -nographics -quit \
              -projectPath . \
              -executeMethod Words.BuildCommand.BuildAndroid \
              -buildType "${{ needs.setup.outputs.build_type }}" \
              -buildPath "$APK_PATH" \
              -logFile /tmp/unity_build.log; then
            echo "Build succeeded."
          else
            echo "=== Unity build failed; last 200 log lines ==="
            tail -200 /tmp/unity_build.log || true
            exit 1
          fi
          test -f "$APK_PATH" || { echo "APK not found at $APK_PATH"; exit 1; }
          ls -la "$(dirname "$APK_PATH")"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: words-android-${{ needs.setup.outputs.build_type }}
          if-no-files-found: error
          path: |
            ${{ env.PROJECT_PATH }}/Builds/Android/*.apk

  smoke:
    name: Android emulator smoke test
    if: ${{ needs.setup.outputs.run_smoke == 'true' }}
    needs: [setup, build]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: words-android-${{ needs.setup.outputs.build_type }}
          path: artifact

      - name: Enable KVM hardware acceleration
        shell: bash
        run: |
          set -euo pipefail
          # Batch 26E: every hosted-emulator run so far has booted with
          # "-accel off". The logs show why:
          #   ProbeKVM: This user doesn't have permissions to use KVM (/dev/kvm)
          #   The KVM line in /etc/group is: [kvm:x:993:]
          #   Disabling Linux hardware acceleration.
          # so the x86_64 system image cold-boots in pure software emulation -
          # 368727, 373647, 441757 and 587748 ms across four runs - and
          # com.android.systemui ANRs under the load, which is what the focus
          # gate has been reporting as "a system window stayed in front". The
          # kvm group exists but has no members. Group membership does not apply
          # to the current shell, so the device node is opened directly, which
          # is the fix the emulator's own diagnostic prints.
          if [ -e /dev/kvm ]; then
            sudo chown -R "$USER" /dev/kvm
            sudo chmod 666 /dev/kvm
            echo "/dev/kvm:"; ls -l /dev/kvm
          else
            echo "::warning::/dev/kvm is absent on this runner; the emulator will stay in software emulation"
          fi

      - name: Install and launch on hosted emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ needs.setup.outputs.api_level }}
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          # disable-animations triggers `settings put` right after boot, which
          # flakes on API 35 x86_64 ("Broken pipe (32)"). The retry attempt
          # below uses API 34, where that call is stable.
          disable-animations: false
          script: |
            # The device flow lives in tools/android-smoke.sh: the runner runs
            # each script line with its own `sh -c`, so a multi-line inline
            # script cannot keep state. One call keeps the whole flow in one
            # shell and makes the assertions reviewable in the repository.
            # Backend is reported as ANDROID_BACKEND=... by the script.
            ANDROID_BACKEND=github-hosted-emulator-api${{ matrix.api-level }} bash tools/android-smoke.sh artifact

      - name: Upload device diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-smoke-diagnostics
          path: |
            logcat.txt
            android-smoke.png
          if-no-files-found: ignore
          retention-days: 7

  smoke-retry:
    name: Android emulator smoke test (retry, API 33)
    # Only a *failed* first attempt is retried, and it is retried on a
    # different emulator image rather than the same one: every hosted-emulator
    # flake seen on 2026-09-10 (adb Broken pipe during install, keyevent 82,
    # monkey aborting on a media-provider crash) was image/instance specific.
    # The product assertion is unchanged, so this is a backend retry, not a
    # weakened test. A cancelled run is not retried.
    if: ${{ always() && needs.setup.outputs.run_smoke == 'true' && needs.smoke.result == 'failure' }}
    needs: [setup, build, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: words-android-${{ needs.setup.outputs.build_type }}
          path: artifact

      - name: Enable KVM hardware acceleration
        shell: bash
        run: |
          set -euo pipefail
          # Batch 26E: every hosted-emulator run so far has booted with
          # "-accel off". The logs show why:
          #   ProbeKVM: This user doesn't have permissions to use KVM (/dev/kvm)
          #   The KVM line in /etc/group is: [kvm:x:993:]
          #   Disabling Linux hardware acceleration.
          # so the x86_64 system image cold-boots in pure software emulation -
          # 368727, 373647, 441757 and 587748 ms across four runs - and
          # com.android.systemui ANRs under the load, which is what the focus
          # gate has been reporting as "a system window stayed in front". The
          # kvm group exists but has no members. Group membership does not apply
          # to the current shell, so the device node is opened directly, which
          # is the fix the emulator's own diagnostic prints.
          if [ -e /dev/kvm ]; then
            sudo chown -R "$USER" /dev/kvm
            sudo chmod 666 /dev/kvm
            echo "/dev/kvm:"; ls -l /dev/kvm
          else
            echo "::warning::/dev/kvm is absent on this runner; the emulator will stay in software emulation"
          fi

      - name: Install and launch on hosted emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: false
          script: |
            ANDROID_BACKEND=github-hosted-emulator-api33-retry bash tools/android-smoke.sh artifact

      - name: Upload device diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-smoke-diagnostics-retry
          path: |
            logcat.txt
            android-smoke.png
          if-no-files-found: ignore
          retention-days: 7

  smoke-gate:
    name: Device smoke verdict
    # Single place that decides whether the device evidence exists. Both legs
    # run the same script, so green here always means WORDS_SWIPE_SMOKE_OK was
    # printed by a real emulator, on either backend.
    if: ${{ always() && needs.setup.outputs.run_smoke == 'true' }}
    needs: [setup, smoke, smoke-retry]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Evaluate
        run: |
          echo "smoke: ${{ needs.smoke.result }}"
          echo "smoke-retry: ${{ needs.smoke-retry.result }}"
          # The two legs write a class marker into their own log; the gate
          # cannot read them, so the distinction is stated here for whoever
          # triages a red run: INFRA_FAIL = the device was unusable,
          # PRODUCT_FAIL = the app failed a real assertion. Only the second
          # one should stop a release.
          cat <<'NOTE'
          Verdict classes emitted by tools/android-smoke.sh:
            INFRA_FAIL    - emulator boot / install / foreground / adb input
                            (exit 1 or 8): the device backend was unusable.
                            Retry, do not "fix" the app.
            PRODUCT_FAIL  - the app had focus, a swipe was delivered and the
                            gesture marker was absent (exit 1): a real
                            regression; this one blocks.
          NOTE
          if [ "${{ needs.smoke.result }}" != "success" ] && [ "${{ needs.smoke-retry.result }}" != "success" ]; then
            echo "::error::Android device smoke failed on both hosted emulator images - inspect the smoke job log and the uploaded logcat/screenshot artifacts, then decide whether this is a product regression or an exhausted emulator pool"
            exit 1
          fi
