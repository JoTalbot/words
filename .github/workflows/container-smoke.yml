name: Container smoke

# Additive pipeline owned by the infrastructure lane (agent/COORDINATION.md).
# It proves the deliverable artifact — the container image and the compose
# stack — actually runs. The Go unit/integration suite stays in ci.yml and the
# Unity Android pipeline stays in unity-android.yml; neither is modified here.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repo-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Reject tracked build output and oversized blobs
        run: python3 tools/check-repo-hygiene.py
  compose-smoke:
    name: Build image and smoke the compose stack
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Show Docker environment
        run: |
          docker version
          docker compose version

      - name: Build the game image
        run: |
          set -euo pipefail
          docker build -f infra/Dockerfile -t wordarena-game:local .

      - name: Start the compose stack
        run: |
          set -euo pipefail
          docker compose -f infra/docker-compose.yml up -d --build

      - name: Wait for both services to report healthy
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            db="$(docker compose -f infra/docker-compose.yml ps --format '{{.Service}} {{.Health}}' | awk '$1=="db"{print $2}')"
            game="$(docker compose -f infra/docker-compose.yml ps --format '{{.Service}} {{.Health}}' | awk '$1=="game"{print $2}')"
            echo "attempt $i: db=$db game=$game"
            if [ "$db" = "healthy" ] && [ "$game" = "healthy" ]; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::compose stack did not become healthy"
          docker compose -f infra/docker-compose.yml ps
          exit 1

      - name: Run the smoke checks
        env:
          SMOKE_EXPECT_STORAGE: postgres
        run: |
          set -euo pipefail
          bash infra/smoke.sh http://127.0.0.1:18080

      - name: Verify the monitoring assets against the live exposition
        run: |
          set -euo pipefail
          # Static checks plus a live cross-check: every metric the dashboard
          # queries must actually be exposed by this build.
          python3 tools/check-monitoring-assets.py --live http://127.0.0.1:18080

      - name: Assert durable storage is Postgres
        run: |
          set -euo pipefail
          body="$(curl -s -m 10 http://127.0.0.1:18080/readyz)"
          echo "readyz: $body"
          echo "$body" | grep -q '"storage":"postgres"'

      - name: Assert telemetry JSONL is written inside the container
        run: |
          set -euo pipefail
          docker compose -f infra/docker-compose.yml exec -T game \
            sh -c 'test -s /var/log/wordarena/events.jsonl'
          echo "--- last telemetry events ---"
          docker compose -f infra/docker-compose.yml exec -T game \
            sh -c 'tail -n 5 /var/log/wordarena/events.jsonl'

      - name: Collect diagnostics on failure
        if: failure()
        run: |
          docker compose -f infra/docker-compose.yml ps || true
          docker compose -f infra/docker-compose.yml logs --no-color --tail 200 || true

      - name: Tear down
        if: always()
        run: |
          docker compose -f infra/docker-compose.yml down -v || true

  migrations:
    name: Apply schema migrations against Postgres
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Expose the database on a fixed host port
        run: |
          set -euo pipefail
          cat > /tmp/compose-migrate.yml <<'YAML'
          services:
            db:
              ports:
                - "55432:5432"
          YAML
          docker compose -f infra/docker-compose.yml -f /tmp/compose-migrate.yml up -d db
          for i in $(seq 1 40); do
            if docker compose -f infra/docker-compose.yml -f /tmp/compose-migrate.yml ps --format '{{.Service}} {{.Health}}' | grep -q '^db healthy$'; then
              exit 0
            fi
            sleep 3
          done
          echo "::error::database did not become healthy"
          docker compose -f infra/docker-compose.yml -f /tmp/compose-migrate.yml logs db
          exit 1

      - name: Plan reports the baseline as pending
        working-directory: server
        env:
          DSN: postgres://wordarena:wordarena@127.0.0.1:55432/wordarena?sslmode=disable
        run: |
          set -euo pipefail
          out="$(go run ./cmd/migrate -dsn "$DSN" -plan)"
          echo "$out"
          echo "$out" | grep -q '001_init.sql'

      - name: Apply the migrations
        working-directory: server
        env:
          DSN: postgres://wordarena:wordarena@127.0.0.1:55432/wordarena?sslmode=disable
        run: |
          set -euo pipefail
          out="$(go run ./cmd/migrate -dsn "$DSN")"
          echo "$out"
          echo "$out" | grep -q 'applying 001_init.sql'

      - name: Re-applying is a no-op
        working-directory: server
        env:
          DSN: postgres://wordarena:wordarena@127.0.0.1:55432/wordarena?sslmode=disable
        run: |
          set -euo pipefail
          out="$(go run ./cmd/migrate -dsn "$DSN")"
          echo "$out"
          echo "$out" | grep -q 'schema up to date'
          if echo "$out" | grep -q 'applying'; then
            echo "::error::migration re-applied on a second run"
            exit 1
          fi

      - name: History and tables are recorded
        run: |
          set -euo pipefail
          docker compose -f infra/docker-compose.yml -f /tmp/compose-migrate.yml exec -T db \
            psql -U wordarena -d wordarena -c 'SELECT version, name FROM schema_migrations ORDER BY version;'
          docker compose -f infra/docker-compose.yml -f /tmp/compose-migrate.yml exec -T db \
            psql -U wordarena -d wordarena -c '\dt'

      - name: Tear down
        if: always()
        run: |
          docker compose -f infra/docker-compose.yml -f /tmp/compose-migrate.yml down -v || true

  test-assets:
    name: Validate test data assets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check test assets against source constants
        run: python3 tools/check-test-assets.py

      - name: Check monitoring assets against source constants
        run: python3 tools/check-monitoring-assets.py
