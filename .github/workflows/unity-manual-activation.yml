name: Unity Manual Activation Request

# Generates a .alf activation-request file bound to the GitHub-hosted runner
# (x86_64). The user uploads it to https://license.unity3d.com/manual to get
# a .ulf, then stores the .ulf contents as the UNITY_LICENSE secret.
# This is the reliable path when the Unity account has MFA/SSO enabled and
# email/password automation is rejected ("Invalid Credential" 143.002).

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  activation-file:
    name: Generate .alf activation request
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: unityci/editor:ubuntu-6000.0.59f2-android-3.2.2
    steps:
      - name: Create manual activation file
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          echo "Workspace: $GITHUB_WORKSPACE"
          unity-editor -batchmode -nographics -quit \
            -createManualActivationFile -logFile /tmp/alf.log || true

          ALF=$(find "$GITHUB_WORKSPACE" /root /tmp -name '*.alf' 2>/dev/null | head -1 || true)
          if [ -z "$ALF" ]; then
            echo "No .alf was produced. Log tail:"
            tail -60 /tmp/alf.log || true
            exit 1
          fi
          echo "Activation request file: $ALF"
          ls -la "$(dirname "$ALF")"

      - name: Upload .alf artifact
        uses: actions/upload-artifact@v4
        with:
          name: unity-activation-request
          path: '*.alf'
          if-no-files-found: error
