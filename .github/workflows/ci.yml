name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  sanity:
    name: Repository sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate repository layout
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test -f docs/ARCHITECTURE.md
          test -f docs/M0.md
          test -f proto/buf.yaml
          test -f proto/wordarena/v1/match.proto
          test -f server/go.mod

      - name: Validate protobuf source
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'syntax = "proto3";' proto/wordarena/v1/match.proto
          grep -q 'package wordarena.net.v1;' proto/wordarena/v1/match.proto

  go:
    name: Go tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wordarena
          POSTGRES_PASSWORD: wordarena
          POSTGRES_DB: wordarena_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wordarena -d wordarena_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
      - name: gofmt
        working-directory: server
        shell: bash
        run: |
          set -euo pipefail
          # Formatting is a merge precondition, not a taste: 8 files had
          # drifted with no gate to catch it, and a reviewer reading a diff
          # that is mostly realignment cannot see the actual change.
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed for:"
            echo "$unformatted"
            echo
            echo "run: gofmt -w <files>"
            exit 1
          fi
      - run: go vet ./...
        working-directory: server
      - run: go test ./...
        working-directory: server
        env:
          # Runs the Postgres integration tests (store_pg_test.go) in
          # addition to the in-memory suite.
          WORDARENA_TEST_POSTGRES_DSN: postgres://wordarena:wordarena@127.0.0.1:5432/wordarena_test?sslmode=disable

  browser:
    name: Browser transport smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned browser tooling
        run: |
          python -m pip install playwright==1.63.0
          python -m playwright install --with-deps chromium
      - name: Build isolated game service
        working-directory: server
        run: go build -o "$RUNNER_TEMP/wordarena-browser" ./cmd/game
      - name: Require real binary frames and reject false positives
        shell: bash
        env:
          WORDARENA_ADDR: 127.0.0.1:18110
          WORDARENA_SERVER_URL: http://127.0.0.1:18110
          WORDARENA_SCREENSHOT: ${{ runner.temp }}/browser-transport.png
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/wordarena-browser" > "$RUNNER_TEMP/browser-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" || true' EXIT
          python - <<'PYREADY'
          import time, urllib.request
          for attempt in range(50):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:18110/readyz', timeout=1) as r:
                      if r.status == 200:
                          break
              except OSError:
                  time.sleep(0.1)
          else:
              raise SystemExit('isolated server not ready')
          PYREADY
          python client/web-m0/test-smoke.py
          if env -u WORDARENA_SERVER_URL python client/web-m0/test-smoke.py; then
            echo 'ERROR: missing server configuration unexpectedly passed'; exit 1
          fi
      - name: Upload transport screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-transport
          path: ${{ runner.temp }}/browser-transport.png
          if-no-files-found: warn
