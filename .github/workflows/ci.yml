name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  sanity:
    name: Repository sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate repository layout
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test -f docs/ARCHITECTURE.md
          test -f docs/M0.md
          test -f proto/buf.yaml
          test -f proto/wordarena/v1/match.proto
          test -f server/go.mod

      - name: Validate protobuf source
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'syntax = "proto3";' proto/wordarena/v1/match.proto
          grep -q 'package wordarena.net.v1;' proto/wordarena/v1/match.proto

  go:
    name: Go tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
      - run: go test ./...
        working-directory: server
