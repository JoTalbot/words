syntax = "proto3";

package wordarena.net.v1;

option go_package = "github.com/JoTalbot/words/server/gen/wordarena/net/v1;wordarenav1";

message InputCoordinate {
  float x = 1;
  float y = 2;
  uint32 timestamp_delta_ms = 3;
}

message SubmitWordIntent {
  uint64 match_id = 1;
  uint32 client_sequence = 2;
  repeated uint32 letter_indices = 3;
  repeated InputCoordinate touch_path = 4;
  // Client timing is telemetry only and is never used as competitive authority.
  uint64 client_timestamp_ms = 5;
}

enum WordResult {
  WORD_RESULT_UNSPECIFIED = 0;
  ACCEPTED = 1;
  REJECTED_NOT_IN_DICT = 2;
  ALREADY_CLAIMED = 3;
  BLOCKED_BY_RULE = 4;
  INVALID_INPUT = 5;
  MATCH_NOT_ACTIVE = 6;
}

message WordValidatedEvent {
  uint64 event_id = 1;
  uint32 server_tick = 2;
  uint32 client_sequence = 3;
  WordResult result = 4;
  string normalized_word = 5;
  uint32 score_added = 6;
  uint32 total_score = 7;
  float combo_multiplier = 8;
  uint32 claimed_cell_index = 9;
  bool is_steal = 10;
  uint32 state_version = 11;
  // The account whose intent produced this event. Clients need it to
  // attribute scores and steal debits without guessing.
  uint64 user_id = 12;
}

// ClientHello is the first message a client MAY send immediately after the
// WebSocket upgrade (M2 batch 33, protocol-version debt). It names the wire
// protocol version the client speaks and the optional capabilities it
// supports, so the server stops deciding unilaterally whether to send state
// deltas (batch 32A added deltas with no negotiation: an older client
// tolerates them only by luck, because proto3 silently skips unknown fields).
// A client that never sends a ClientHello is served exactly as before (the
// legacy path): the server streams a full snapshot on connect and may send
// deltas when the connection is in sync.
message ClientCapabilities {
  // supports_delta lets the server send MatchStateDelta frames (batch 32A)
  // instead of full MatchStateSnapshot frames. A client that cannot apply a
  // delta MUST set this false; absent (a ClientHello with no capabilities) or
  // an unset field defaults to true so sending a hello never downgrades a
  // capable client.
  bool supports_delta = 1;
}

message ClientHello {
  uint32 protocol_version = 1;
  ClientCapabilities capabilities = 2;
}

// ServerHello is the server's reply to a ClientHello. It is sent ONLY when the
// client sent a ClientHello; legacy clients receive no ServerHello and are
// served exactly as before. It echoes the negotiated protocol version and the
// delta decision so the client knows what it will receive before the first
// state frame.
message ServerHello {
  uint32 protocol_version = 1;
  ClientCapabilities server_capabilities = 2;
  // use_delta is the server's final decision: deltas are sent iff this is
  // true AND the connection is in sync. A client that set supports_delta=false
  // sees this false and must never receive a delta frame.
  bool use_delta = 3;
}

message ResumeRequest {
  uint64 match_id = 1;
  bytes session_resume_token = 2;
  uint32 last_state_version = 3;
}

message MatchStateSnapshot {
  uint64 match_id = 1;
  uint32 server_tick = 2;
  uint32 remaining_time_ms = 3;
  uint32 current_wave = 4;
  uint32 state_version = 5;
  repeated PlayerState players = 6;
  repeated BoardCell cells = 7;
  // Terminal flag: true once the match has finished. The transport sends
  // exactly one final snapshot with over=true so clients can deterministically
  // stop play and render the result; afterwards the room is removed.
  bool over = 8;
}

message PlayerState {
  uint64 user_id = 1;
  uint32 score = 2;
  uint32 rank_position = 3;
  bool is_eliminated = 4;
  float combo_multiplier = 5;
  // is_bot marks a seat the SERVER has declared to be played by a simulated
  // player (M2 batch 32D, product decision Q5). It is set only from an
  // explicit server-side declaration - never inferred from a missing profile,
  // never sent by a client - and it is delivered to every observer, so a bot
  // can never pass for a human in a snapshot, in the HTTP state view or in the
  // finished result. See docs/M2-BOT-POLICY.md.
  bool is_bot = 6;
}

// MatchStateDelta is the bandwidth-shaped spelling of MatchStateSnapshot
// (M2 batch 32A). A full snapshot repeats every player and every cell on
// every frame, so a 60-seat Royale pays ~60x the bytes for state that has
// not changed since the previous frame. A delta carries the same scalars
// plus ONLY the players and cells whose value differs from the frame it is
// based on, which is what makes the large-roster mode affordable on the
// wire.
//
// Reconstruction is exact: a client that holds the full snapshot at
// base_version and applies this delta must end up with a value identical to
// the full snapshot the server would have sent for state_version. Only
// scalars are always present; the repeated fields are a change set, so an
// empty list means "unchanged", never "cleared".
//
// The delta is derived state, not authority: it is computed from two
// canonical server snapshots and introduces no client-side competitive
// input. A client that cannot apply it (gap in the stream, reconnect, first
// frame of a connection) asks by simply not being in sync - the server
// tracks the last version it sent per connection and falls back to a full
// MatchStateSnapshot whenever the base does not match.
message MatchStateDelta {
  uint64 match_id = 1;
  uint32 server_tick = 2;
  uint32 remaining_time_ms = 3;
  uint32 current_wave = 4;
  // The version this delta produces.
  uint32 state_version = 5;
  // The version the receiver must already hold. A receiver whose state is
  // at any other version must discard the delta and wait for a full
  // snapshot.
  uint32 base_version = 6;
  // Changed or newly visible players only, identified by user_id.
  repeated PlayerState players = 7;
  // Changed cells only, identified by cell_id.
  repeated BoardCell cells = 8;
  // Same terminal flag as MatchStateSnapshot.over.
  bool over = 9;
}

message BoardCell {
  uint32 cell_id = 1;
  string letter = 2;
  uint64 owner_user_id = 3;
  bool is_locked = 4;
  uint32 lock_remaining_ms = 5;
}

message ClientEnvelope {
  uint64 match_id = 1;
  oneof payload {
    SubmitWordIntent submit_word = 2;
    ResumeRequest resume = 3;
    ClientHello hello = 4;
  }
}

message ServerEnvelope {
  uint64 match_id = 1;
  oneof payload {
    WordValidatedEvent word_event = 2;
    MatchStateSnapshot snapshot = 3;
    // Batch 32A: a delta against the previous snapshot. Sent to a
    // connection that is already in sync at delta.base_version; a
    // connection that is not in sync receives snapshot instead.
    MatchStateDelta snapshot_delta = 4;
    ServerHello hello = 5;
  }
}
